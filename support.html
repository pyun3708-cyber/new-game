<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f3ec">
  <title>赞助校方 · 反媚黑高校</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap');
    :root {
      --paper: #f7f3ec;
      --ink: #292824;
      --muted: #777268;
      --line: rgba(41, 40, 36, 0.15);
      --accent: #8b765d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 12%, rgba(139,118,93,.08), transparent 30%),
        radial-gradient(circle at 88% 78%, rgba(139,118,93,.07), transparent 32%),
        var(--paper);
      font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
      letter-spacing: .06em;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    a { color: inherit; text-decoration: none; }
    .wrap {
      width: min(720px, 92%);
      margin: 0 auto;
      padding: 48px 0 36px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .eyebrow {
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: .32em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    h1 {
      font-size: clamp(26px, 6vw, 40px);
      font-weight: 500;
      letter-spacing: .18em;
      margin-bottom: 12px;
    }
    .sub {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
      margin-bottom: 36px;
    }
    .qr-row {
      display: flex;
      flex-wrap: wrap;
      gap: 28px;
      justify-content: center;
      width: 100%;
      margin-bottom: 40px;
    }
    .qr-card {
      background: rgba(255,255,255,.65);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px 18px 14px;
      width: min(280px, 100%);
      box-shadow: 0 10px 30px rgba(41,40,36,.06);
    }
    .qr-card img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 10px;
      background: #fff;
    }
    .qr-card .label {
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: .12em;
    }
    .back {
      margin-top: auto;
      padding: 10px 0 28px;
      font-size: 14px;
      letter-spacing: .16em;
      color: var(--accent);
    }
    .back a {
      border-bottom: 1px solid rgba(139,118,93,.35);
      padding-bottom: 2px;
      transition: color .2s, border-color .2s;
    }
    .back a:hover {
      color: #6e5c46;
      border-color: #6e5c46;
    }
    footer {
      width: min(720px, 92%);
      padding: 16px 0 28px;
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .14em;
      border-top: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">SUPPORT · 反媚黑高校</div>
    <h1>谢谢宝宝的赞赏~</h1>
    <p class="sub">长按或扫描下方二维码即可赞赏赞助校方<br>每一份支持都会用来维护网站与更新课程内容</p>
    <div class="qr-row">
      <div class="qr-card">
        <img src="support-qr-1.jpg" alt="赞赏二维码 1">
        <div class="label">扫码赞赏 · 方式一</div>
      </div>
      <div class="qr-card">
        <img src="support-qr-2.jpg" alt="赞赏二维码 2">
        <div class="label">扫码赞赏 · 方式二</div>
      </div>
    </div>
    <div class="back">
      <a href="school.html">← 返回学校官网</a>
    </div>
  </div>
  <footer>
    <span>反媚黑高校 · SPONSOR</span>
    <span>© 2026</span>
  </footer>
</body>
</html>
