<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f3ec">
  <title>赞助校方 · 反媚黑高校</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap');
    :root {
      --paper: #f7f3ec;
      --ink: #292824;
      --muted: #777268;
      --line: rgba(41, 40, 36, 0.15);
      --accent: #8b765d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 12%, rgba(139,118,93,.08), transparent 30%),
        radial-gradient(circle at 88% 78%, rgba(139,118,93,.07), transparent 32%),
        var(--paper);
      font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
      letter-spacing: .06em;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    a { color: inherit; text-decoration: none; }
    .wrap {
      width: min(720px, 92%);
      margin: 0 auto;
      padding: 72px 0 36px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .eyebrow {
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: .32em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    h1 {
      font-size: clamp(22px, 5vw, 32px);
      font-weight: 500;
      letter-spacing: .14em;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .msg {
      color: #514e47;
      font-size: 16px;
      line-height: 2;
      max-width: 28em;
      margin-bottom: 48px;
    }
    .back {
      margin-top: auto;
      padding: 10px 0 28px;
      font-size: 14px;
      letter-spacing: .16em;
      color: var(--accent);
    }
    .back a {
      border-bottom: 1px solid rgba(139,118,93,.35);
      padding-bottom: 2px;
      transition: color .2s, border-color .2s;
    }
    .back a:hover {
      color: #6e5c46;
      border-color: #6e5c46;
    }
    footer {
      width: min(720px, 92%);
      padding: 16px 0 28px;
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .14em;
      border-top: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">SUPPORT · 反媚黑高校</div>
    <h1>为爱发电</h1>
    <p class="msg">为爱发电，你的参与就是最好的赞助。<br>（如果实在想赞助可以联系草莓酱 tg）</p>
    <div class="back">
      <a href="school.html">← 返回学校官网</a>
    </div>
  </div>
  <footer>
    <span>反媚黑高校 · SPONSOR</span>
    <span>© 2026</span>
  </footer>
</body>
</html>
