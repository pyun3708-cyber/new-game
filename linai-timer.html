<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>黎奈同学的憋尿计时器🖤~</title>
  <style>
    :root {
      --pink: #ff8fb8;
      --pink-deep: #ff5a9a;
      --pink-soft: #ffe4ef;
      --pink-bg1: #fff0f6;
      --pink-bg2: #ffd6e7;
      --text: #5a2a3c;
      --card: rgba(255, 255, 255, 0.72);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      color: var(--text);
      background: linear-gradient(165deg, var(--pink-bg1) 0%, #ffc1d9 45%, var(--pink-bg2) 100%);
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
    }
    a.back {
      align-self: flex-start;
      color: var(--pink-deep);
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 12px;
      opacity: 0.9;
    }
    a.back:hover { opacity: 1; text-decoration: underline; }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 28px;
      box-shadow: 0 16px 48px rgba(255, 90, 154, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.7);
      padding: 28px 22px 26px;
      text-align: center;
    }
    .avatar-wrap {
      width: 128px;
      height: 128px;
      margin: 0 auto 16px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, #ff9ec4, #ff5a9a, #ffb6d9);
      box-shadow: 0 8px 24px rgba(255, 90, 154, 0.35);
    }
    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      background: #fff;
    }
    h1 {
      font-size: 1.25rem;
      line-height: 1.45;
      margin-bottom: 6px;
      color: #c2185b;
      font-weight: 700;
    }
    .sub {
      font-size: 13px;
      color: #a05a78;
      margin-bottom: 22px;
    }
    .timer {
      font-variant-numeric: tabular-nums;
      font-size: clamp(2.4rem, 10vw, 3.2rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #ad1457;
      margin: 8px 0 6px;
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.6);
    }
    .status {
      display: inline-block;
      font-size: 13px;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 22px;
      background: rgba(255, 255, 255, 0.7);
      color: #9c4068;
    }
    .status.running {
      background: rgba(255, 90, 154, 0.18);
      color: #c2185b;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.65; }
    }
    .btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .btns .full { grid-column: 1 / -1; }
    button {
      border: none;
      border-radius: 16px;
      padding: 14px 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.12s;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { transform: scale(0.97); }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }
    .btn-start {
      background: linear-gradient(135deg, #ff7eb3, #ff4d94);
      color: #fff;
      box-shadow: 0 6px 18px rgba(255, 77, 148, 0.4);
    }
    .btn-pause {
      background: linear-gradient(135deg, #f5d0e0, #e8a8c4);
      color: #7a304e;
      box-shadow: 0 6px 18px rgba(180, 100, 130, 0.2);
    }
    .btn-add {
      background: linear-gradient(135deg, #2b2b2b, #4a4a4a);
      color: #ffb6d9;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
    }
    .hint {
      margin-top: 18px;
      font-size: 12px;
      color: #b07090;
      line-height: 1.55;
    }
    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(80, 20, 50, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 20px;
    }
    .modal-mask.show { display: flex; }
    .modal {
      width: 100%;
      max-width: 340px;
      background: #fff;
      border-radius: 20px;
      padding: 22px 18px 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
      text-align: left;
    }
    .modal h2 {
      font-size: 17px;
      color: #c2185b;
      margin-bottom: 12px;
      text-align: center;
    }
    .modal label {
      display: block;
      font-size: 13px;
      color: #8a4a66;
      margin: 10px 0 6px;
    }
    .modal input {
      width: 100%;
      border: 1.5px solid #f5b6d0;
      border-radius: 12px;
      padding: 11px 12px;
      font-size: 16px;
      outline: none;
      font-family: inherit;
    }
    .modal input:focus { border-color: #ff5a9a; }
    .modal .row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .modal .row button { flex: 1; }
    .btn-cancel {
      background: #f3e4eb;
      color: #7a4058;
    }
    .btn-ok {
      background: linear-gradient(135deg, #ff7eb3, #ff4d94);
      color: #fff;
    }
    .err {
      color: #d32f2f;
      font-size: 12px;
      margin-top: 8px;
      min-height: 16px;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%) translateY(20px);
      background: rgba(50, 20, 35, 0.88);
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 60;
      max-width: 90%;
      text-align: center;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <a class="back" href="index.html">← 返回草莓酱的个人主页</a>

  <div class="card">
    <div class="avatar-wrap">
      <img src="linai-avatar.jpg" alt="黎奈" />
    </div>
    <h1>黎奈同学的憋尿计时器🖤~</h1>
    <p class="sub">只能加时与暂停 · 时间只会自己流逝哦❤</p>

    <div class="timer" id="display">00:00:00</div>
    <div class="status" id="status">未开始</div>

    <div class="btns">
      <button type="button" class="btn-start" id="btnStart" onclick="onStart()">开始❤</button>
      <button type="button" class="btn-pause" id="btnPause" onclick="onPause()" disabled>暂停</button>
      <button type="button" class="btn-add full" id="btnAdd" onclick="openAddModal()">加时🖤</button>
    </div>

    <p class="hint">
      时长会保存在本机，刷新不会清零。<br />
      不可主动减少时间，只能等它自己走过去❤<br />
      加时需要密码。
    </p>
  </div>

  <div class="modal-mask" id="addModal" onclick="if(event.target===this)closeAddModal()">
    <div class="modal">
      <h2>加时🖤</h2>
      <label>密码</label>
      <input type="password" id="pwdInput" placeholder="请输入密码" autocomplete="off" />
      <label>增加时长（分钟）</label>
      <input type="number" id="minsInput" min="1" step="1" placeholder="例如 10" />
      <div class="err" id="addErr"></div>
      <div class="row">
        <button type="button" class="btn-cancel" onclick="closeAddModal()">取消</button>
        <button type="button" class="btn-ok" onclick="confirmAdd()">确认加时</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = 'linai_hold_timer_v1';
    const ADD_PASSWORD = '1314';

    let state = {
      accumulatedMs: 0,
      running: false,
      runStartedAt: null
    };

    let tickTimer = null;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (typeof parsed.accumulatedMs === 'number' && parsed.accumulatedMs >= 0) {
          state.accumulatedMs = parsed.accumulatedMs;
        }
        state.running = !!parsed.running;
        state.runStartedAt = typeof parsed.runStartedAt === 'number' ? parsed.runStartedAt : null;
        if (state.running && !state.runStartedAt) {
          state.running = false;
          state.runStartedAt = null;
        }
      } catch (e) { /* ignore */ }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      try {
        localStorage.setItem(STORAGE_KEY + '_ping', String(Date.now()));
      } catch (e) {}
    }

    function nowElapsed() {
      let ms = state.accumulatedMs;
      if (state.running && state.runStartedAt) {
        ms += Math.max(0, Date.now() - state.runStartedAt);
      }
      return Math.max(0, ms);
    }

    function formatMs(ms) {
      const totalSec = Math.floor(ms / 1000);
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      const pad = (n) => String(n).padStart(2, '0');
      return pad(h) + ':' + pad(m) + ':' + pad(s);
    }

    function render() {
      document.getElementById('display').textContent = formatMs(nowElapsed());
      const status = document.getElementById('status');
      const btnStart = document.getElementById('btnStart');
      const btnPause = document.getElementById('btnPause');
      if (state.running) {
        status.textContent = '憋尿中…坚持住🖤';
        status.classList.add('running');
        btnStart.disabled = true;
        btnPause.disabled = false;
      } else if (state.accumulatedMs > 0) {
        status.textContent = '已暂停';
        status.classList.remove('running');
        btnStart.disabled = false;
        btnStart.textContent = '继续❤';
        btnPause.disabled = true;
      } else {
        status.textContent = '未开始';
        status.classList.remove('running');
        btnStart.disabled = false;
        btnStart.textContent = '开始❤';
        btnPause.disabled = true;
      }
    }

    function startTick() {
      stopTick();
      tickTimer = setInterval(render, 250);
    }
    function stopTick() {
      if (tickTimer) {
        clearInterval(tickTimer);
        tickTimer = null;
      }
    }

    function onStart() {
      if (state.running) return;
      state.running = true;
      state.runStartedAt = Date.now();
      saveState();
      startTick();
      render();
      toast('开始计时啦❤');
    }

    function onPause() {
      if (!state.running) return;
      const extra = Math.max(0, Date.now() - (state.runStartedAt || Date.now()));
      state.accumulatedMs += extra;
      state.running = false;
      state.runStartedAt = null;
      saveState();
      stopTick();
      render();
      toast('已暂停');
    }

    function openAddModal() {
      document.getElementById('pwdInput').value = '';
      document.getElementById('minsInput').value = '';
      document.getElementById('addErr').textContent = '';
      document.getElementById('addModal').classList.add('show');
      setTimeout(() => document.getElementById('pwdInput').focus(), 50);
    }
    function closeAddModal() {
      document.getElementById('addModal').classList.remove('show');
    }

    function confirmAdd() {
      const pwd = document.getElementById('pwdInput').value;
      const mins = parseInt(document.getElementById('minsInput').value, 10);
      const err = document.getElementById('addErr');
      if (pwd !== ADD_PASSWORD) {
        err.textContent = '密码不对哦';
        return;
      }
      if (!Number.isFinite(mins) || mins < 1) {
        err.textContent = '请输入至少 1 分钟';
        return;
      }
      const addMs = mins * 60 * 1000;
      state.accumulatedMs += addMs;
      saveState();
      render();
      closeAddModal();
      toast('已加时 ' + mins + ' 分钟🖤');
    }

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove('show'), 1800);
    }

    window.addEventListener('storage', (e) => {
      if (e.key === STORAGE_KEY || e.key === STORAGE_KEY + '_ping') {
        loadState();
        if (state.running) startTick();
        else stopTick();
        render();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeAddModal();
      if (e.key === 'Enter' && document.getElementById('addModal').classList.contains('show')) {
        confirmAdd();
      }
    });

    loadState();
    render();
    if (state.running) startTick();
  </script>
</body>
</html>
