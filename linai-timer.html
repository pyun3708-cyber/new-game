<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>黎奈同学的憋尿计时器🖤~</title>
  <style>
    :root { --pink:#ff5a9a; --text:#5a2a3c; --card:rgba(255,255,255,.78); }
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);
      background:linear-gradient(165deg,#fff0f6 0%,#ffc1d9 45%,#ffd6e7 100%);background-attachment:fixed;
      display:flex;flex-direction:column;align-items:center;padding:16px 14px 48px}
    a.back{align-self:flex-start;color:var(--pink);text-decoration:none;font-size:14px;margin-bottom:10px}
    .card{width:100%;max-width:440px;background:var(--card);backdrop-filter:blur(12px);border-radius:24px;
      box-shadow:0 12px 36px rgba(255,90,154,.18);border:1px solid rgba(255,255,255,.75);padding:22px 18px 20px;text-align:center;margin-bottom:16px}
    .avatar-wrap{width:112px;height:112px;margin:0 auto 12px;border-radius:50%;padding:3px;
      background:linear-gradient(135deg,#ff9ec4,#ff5a9a,#ffb6d9);box-shadow:0 6px 18px rgba(255,90,154,.3)}
    .avatar-wrap img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;background:#fff}
    h1{font-size:1.15rem;color:#c2185b;margin-bottom:4px}
    h2.section{font-size:1.05rem;color:#ad1457;margin-bottom:6px;text-align:left}
    .sub{font-size:12px;color:#a05a78;margin-bottom:10px;line-height:1.45}
    .sync{display:inline-block;font-size:11px;padding:3px 10px;border-radius:999px;margin-bottom:12px;background:rgba(255,255,255,.75);color:#9c4068}
    .sync.ok{color:#2e7d32;background:rgba(76,175,80,.18)}
    .sync.err{color:#c62828;background:rgba(198,40,40,.12)}
    .timer{font-variant-numeric:tabular-nums;font-size:clamp(2.1rem,9vw,2.9rem);font-weight:800;letter-spacing:.04em;color:#ad1457;margin:6px 0 4px}
    .timer.zero{color:#2e7d32}.timer.sm{font-size:clamp(1.7rem,7vw,2.2rem)}
    .status{display:inline-block;font-size:12px;padding:3px 10px;border-radius:999px;margin-bottom:14px;background:rgba(255,255,255,.7);color:#9c4068}
    .status.running{background:rgba(255,90,154,.18);color:#c2185b}.status.done{background:rgba(76,175,80,.2);color:#2e7d32}
    .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .btns .full{grid-column:1/-1}
    button{border:none;border-radius:14px;padding:12px 10px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
    button:disabled{opacity:.45;cursor:not-allowed}
    .btn-start{background:linear-gradient(135deg,#ff7eb3,#ff4d94);color:#fff}
    .btn-pause{background:linear-gradient(135deg,#f5d0e0,#e8a8c4);color:#7a304e}
    .btn-add{background:linear-gradient(135deg,#2b2b2b,#4a4a4a);color:#ffb6d9}
    .btn-water{background:linear-gradient(135deg,#4fc3f7,#0288d1);color:#fff}
    .btn-drink{background:linear-gradient(135deg,#81d4fa,#0277bd);color:#fff}
    .btn-send{background:linear-gradient(135deg,#ff7eb3,#ff4d94);color:#fff}
    .btn-ghost{background:#f3e4eb;color:#7a4058;font-size:12px;padding:6px 10px;font-weight:600}
    .btn-like{background:#ffe0ec;color:#c2185b;font-size:12px;padding:6px 10px}
    .btn-del{background:#ffcdd2;color:#b71c1c;font-size:12px;padding:6px 10px}
    .stats{margin-top:14px;text-align:left;font-size:13px;color:#8a4a66;background:rgba(255,255,255,.55);border-radius:12px;padding:10px 12px;line-height:1.7}
    .stats strong{color:#ad1457}
    .water-box{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 12px;flex-wrap:wrap}
    .water-num{font-size:1.5rem;font-weight:800;color:#0277bd}
    .hint{margin-top:8px;font-size:11px;color:#b07090;line-height:1.5;text-align:left}
    .board-sub{font-size:12px;color:#c2185b;margin-bottom:12px;text-align:left;line-height:1.4}
    .msg-form{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
    .msg-form input,.msg-form textarea{width:100%;border:1.5px solid #f5b6d0;border-radius:12px;padding:10px 12px;font-size:14px;font-family:inherit;outline:none}
    .msg-form textarea{min-height:72px;resize:vertical}
    .msg-list{text-align:left;max-height:480px;overflow-y:auto}
    .msg{background:rgba(255,255,255,.7);border-radius:12px;padding:10px 12px;margin-bottom:10px;border:1px solid #f8d0e0}
    .msg .meta{font-size:11px;color:#a05a78;margin-bottom:4px}
    .msg .body{font-size:14px;color:#5a2a3c;white-space:pre-wrap;word-break:break-word}
    .msg .actions{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
    .msg.reply{margin-left:14px;border-left:3px solid #ff9ec4}
    .modal-mask{position:fixed;inset:0;background:rgba(80,20,50,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
    .modal-mask.show{display:flex}
    .modal{width:100%;max-width:340px;background:#fff;border-radius:18px;padding:20px 16px 16px;text-align:left}
    .modal h3{font-size:16px;color:#c2185b;margin-bottom:10px;text-align:center}
    .modal label{display:block;font-size:12px;color:#8a4a66;margin:8px 0 4px}
    .modal input{width:100%;border:1.5px solid #f5b6d0;border-radius:10px;padding:10px 12px;font-size:15px;outline:none;font-family:inherit}
    .modal .row{display:flex;gap:8px;margin-top:14px}
    .modal .row button{flex:1}
    .btn-cancel{background:#f3e4eb;color:#7a4058}
    .btn-ok{background:linear-gradient(135deg,#ff7eb3,#ff4d94);color:#fff}
    .err{color:#d32f2f;font-size:12px;margin-top:6px;min-height:16px}
    .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);background:rgba(50,20,35,.9);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90%;text-align:center}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  </style>
</head>
<body>
  <a class="back" href="index.html">← 返回草莓酱的个人主页</a>

  <div class="card">
    <div class="avatar-wrap"><img src="linai-avatar.jpg" alt="黎奈" /></div>
    <h1>黎奈同学的憋尿计时器🖤~</h1>
    <p class="sub">倒计时憋尿 · 全网同步 · 归零才可以尿尿哦❤</p>
    <div class="sync" id="sync">正在连接…</div>

    <div class="timer" id="holdDisplay">00:00:00</div>
    <div class="status" id="holdStatus">加载中…</div>
    <div class="btns">
      <button class="btn-start" onclick="openModal('holdStart')">开始/继续❤</button>
      <button class="btn-pause" id="holdPauseBtn" onclick="openModal('holdPause')" disabled>暂停</button>
      <button class="btn-add full" onclick="openModal('holdAdd')">加时🖤</button>
    </div>

    <div class="water-box">
      <div>
        <div style="font-size:12px;color:#0277bd">当前待喝水量</div>
        <div class="water-num"><span id="tankMl">0</span> ml</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;min-width:140px">
        <button class="btn-water" id="btnFeed" onclick="feedWater()">喂黎奈喝水 +50ml</button>
        <button class="btn-drink" onclick="openModal('drink')">黎奈喝水🖤</button>
      </div>
    </div>
    <div class="hint" id="feedHint">每位用户每 7 天只能喂一次水。</div>

    <div class="stats">
      📊 记录<br>
      累计憋尿时长：<strong id="totalHold">00:00:00</strong><br>
      累计已喝水量：<strong id="totalDrunk">0</strong> ml
    </div>
  </div>

  <div class="card">
    <h2 class="section">禁止高潮倒计时🖤</h2>
    <p class="sub" style="text-align:left">归零前不许高潮 · 全网同步</p>
    <div class="timer sm" id="banDisplay">00:00:00</div>
    <div class="status" id="banStatus">加载中…</div>
    <div class="btns">
      <button class="btn-start" onclick="openModal('banStart')">开始/继续</button>
      <button class="btn-pause" id="banPauseBtn" onclick="openModal('banPause')" disabled>暂停</button>
      <button class="btn-add full" onclick="openModal('banAdd')">加时🖤</button>
    </div>
    <div class="stats">累计禁止高潮时长：<strong id="totalBan">00:00:00</strong></div>
  </div>

  <div class="card">
    <h2 class="section">留言板</h2>
    <p class="board-sub">欢迎大家来羞辱抖m变态发情母猪黎奈</p>
    <div class="msg-form">
      <input id="nickInput" maxlength="16" placeholder="昵称（可选）" />
      <textarea id="msgInput" maxlength="500" placeholder="写留言…（禁止发图）"></textarea>
      <button class="btn-send" onclick="sendMessage()">发送留言</button>
    </div>
    <div class="msg-list" id="msgList">加载留言中…</div>
  </div>

  <div class="modal-mask" id="modal" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <h3 id="modalTitle">需要密码</h3>
      <label>密码（四位）</label>
      <input type="password" id="pwdInput" maxlength="8" placeholder="请输入密码" autocomplete="off" />
      <div id="extraFields"></div>
      <div class="err" id="modalErr"></div>
      <div class="row">
        <button class="btn-cancel" onclick="closeModal()">取消</button>
        <button class="btn-ok" onclick="confirmModal()">确认</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script>
    const PASSWORD = "5200";
    const WEEK_MS = 7 * 24 * 60 * 60 * 1000;
    const FEED_ML = 50;

    const firebaseConfig = {
      apiKey: "AIzaSyBeOpIqMdvV3N7jTrXZwGZxQprPLtoDAy0",
      authDomain: "planning-with-ai-5a793.firebaseapp.com",
      databaseURL: "https://planning-with-ai-5a793-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "planning-with-ai-5a793",
      storageBucket: "planning-with-ai-5a793.firebasestorage.app",
      messagingSenderId: "1092542525478",
      appId: "1:1092542525478:web:a044a52e4334c496e676e7"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();
    const holdRef = db.ref("linai/hold");
    const banRef = db.ref("linai/ban");
    const waterRef = db.ref("linai/water");
    const feedsRef = db.ref("linai/feeds");
    const msgRef = db.ref("linai/messages");

    let uid = null;
    // committedTotal = 已写入的累计；sessionStart = 本次开始运行的时间戳（仅本地显示用）
    let hold = { remainingMs: 0, running: false, endsAt: null, totalHoldMs: 0 };
    let ban = { remainingMs: 0, running: false, endsAt: null, totalBanMs: 0 };
    let water = { tankMl: 0, totalDrunkMl: 0 };
    let myLastFeed = 0;
    let pendingAction = null;
    let pendingMsgId = null;

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove("show"), 2200);
    }
    function fmt(ms) {
      ms = Math.max(0, Math.floor(ms || 0));
      const s = Math.floor(ms / 1000);
      const p = (n) => String(n).padStart(2, "0");
      return p(Math.floor(s / 3600)) + ":" + p(Math.floor((s % 3600) / 60)) + ":" + p(s % 60);
    }
    function remaining(st) {
      if (st.running && st.endsAt) return Math.max(0, st.endsAt - Date.now());
      return Math.max(0, st.remainingMs || 0);
    }
    // 累计显示：已提交 + 当前这段运行时长（平滑，不每秒写库）
    function displayTotal(st, key) {
      const base = st[key] || 0;
      if (st.running && st.sessionStart) {
        return base + Math.max(0, Date.now() - st.sessionStart);
      }
      return base;
    }
    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
    }

    function render() {
      // —— 憋尿 ——
      const hl = remaining(hold);
      const hd = document.getElementById("holdDisplay");
      const hs = document.getElementById("holdStatus");
      hd.textContent = fmt(hl);
      document.getElementById("totalHold").textContent = fmt(displayTotal(hold, "totalHoldMs"));
      document.getElementById("holdPauseBtn").disabled = !hold.running;
      if (hl <= 0) {
        hd.classList.add("zero");
        hs.textContent = "时间到 · 可以尿尿了💚";
        hs.className = "status done";
        if (hold.running) {
          // 归零时结算累计并停表
          const add = hold.sessionStart ? Math.max(0, Date.now() - hold.sessionStart) : 0;
          holdRef.update({
            running: false,
            endsAt: null,
            remainingMs: 0,
            totalHoldMs: (hold.totalHoldMs || 0) + add,
            sessionStart: null
          });
        }
      } else {
        hd.classList.remove("zero");
        if (hold.running) {
          hs.textContent = "憋尿倒计时中…坚持住🖤";
          hs.className = "status running";
        } else {
          hs.textContent = "已暂停 · 剩余 " + fmt(hl);
          hs.className = "status";
        }
      }

      // —— 禁止高潮 ——
      const bl = remaining(ban);
      const bd = document.getElementById("banDisplay");
      const bs = document.getElementById("banStatus");
      bd.textContent = fmt(bl);
      document.getElementById("totalBan").textContent = fmt(displayTotal(ban, "totalBanMs"));
      document.getElementById("banPauseBtn").disabled = !ban.running;
      if (bl <= 0) {
        bd.classList.add("zero");
        bs.textContent = "时间到 · 禁止解除";
        bs.className = "status done";
        if (ban.running) {
          const add = ban.sessionStart ? Math.max(0, Date.now() - ban.sessionStart) : 0;
          banRef.update({
            running: false,
            endsAt: null,
            remainingMs: 0,
            totalBanMs: (ban.totalBanMs || 0) + add,
            sessionStart: null
          });
        }
      } else {
        bd.classList.remove("zero");
        if (ban.running) {
          bs.textContent = "禁止高潮中…";
          bs.className = "status running";
        } else {
          bs.textContent = "已暂停 · 剩余 " + fmt(bl);
          bs.className = "status";
        }
      }

      // —— 水 ——
      document.getElementById("tankMl").textContent = Math.max(0, water.tankMl || 0);
      document.getElementById("totalDrunk").textContent = Math.max(0, water.totalDrunkMl || 0);
      const feedBtn = document.getElementById("btnFeed");
      const feedHint = document.getElementById("feedHint");
      if (myLastFeed && Date.now() - myLastFeed < WEEK_MS) {
        feedBtn.disabled = true;
        const days = Math.ceil((myLastFeed + WEEK_MS - Date.now()) / 86400000);
        feedHint.textContent = "本周已喂过水，约 " + days + " 天后可再喂。";
      } else {
        feedBtn.disabled = false;
        feedHint.textContent = "每位用户每 7 天只能喂一次水（+50ml）。喝水不会影响喂水次数。";
      }
    }

    // —— 弹窗：先读表单再关 ——
    function openModal(action, msgId) {
      pendingAction = action;
      pendingMsgId = msgId || null;
      const titles = {
        holdStart: "开始/继续憋尿",
        holdPause: "暂停憋尿",
        holdAdd: "憋尿加时",
        banStart: "开始/继续禁止高潮",
        banPause: "暂停禁止高潮",
        banAdd: "禁止高潮加时",
        drink: "黎奈喝水（减少待喝水量）",
        deleteAny: "站长删除留言"
      };
      document.getElementById("modalTitle").textContent = titles[action] || "需要密码";
      document.getElementById("pwdInput").value = "";
      document.getElementById("modalErr").textContent = "";
      const extra = document.getElementById("extraFields");
      extra.innerHTML = "";
      if (action === "holdAdd" || action === "banAdd") {
        extra.innerHTML = '<label>增加时长（分钟）</label><input type="number" id="minsInput" min="1" step="1" placeholder="例如 10" />';
      }
      if (action === "drink") {
        extra.innerHTML = '<label>本次喝掉多少 ml</label><input type="number" id="drinkInput" min="1" step="1" placeholder="例如 50" />';
      }
      document.getElementById("modal").classList.add("show");
      setTimeout(() => document.getElementById("pwdInput").focus(), 40);
    }
    function closeModal() {
      document.getElementById("modal").classList.remove("show");
      pendingAction = null;
      pendingMsgId = null;
    }
    function confirmModal() {
      const pwd = document.getElementById("pwdInput").value;
      const err = document.getElementById("modalErr");
      if (pwd !== PASSWORD) {
        err.textContent = "密码不对哦";
        return;
      }
      // ★ 关键：关窗前先读完输入
      const action = pendingAction;
      const msgId = pendingMsgId;
      const minsEl = document.getElementById("minsInput");
      const drinkEl = document.getElementById("drinkInput");
      const mins = minsEl ? parseInt(minsEl.value, 10) : NaN;
      const drinkMl = drinkEl ? parseInt(drinkEl.value, 10) : NaN;
      closeModal();

      if (action === "holdStart") doHoldStart();
      else if (action === "holdPause") doHoldPause();
      else if (action === "holdAdd") doHoldAdd(mins);
      else if (action === "banStart") doBanStart();
      else if (action === "banPause") doBanPause();
      else if (action === "banAdd") doBanAdd(mins);
      else if (action === "drink") doDrink(drinkMl);
      else if (action === "deleteAny") doDeleteAny(msgId);
    }

    function doHoldStart() {
      const left = remaining(hold);
      if (left <= 0) return toast("请先加时");
      if (hold.running) return;
      const now = Date.now();
      holdRef.update({
        running: true,
        endsAt: now + left,
        remainingMs: left,
        sessionStart: now
      }).then(() => toast("开始憋尿倒计时❤")).catch((e) => toast("失败：" + e.message));
    }
    function doHoldPause() {
      if (!hold.running) return;
      const left = remaining(hold);
      const add = hold.sessionStart ? Math.max(0, Date.now() - hold.sessionStart) : 0;
      holdRef.update({
        running: false,
        endsAt: null,
        remainingMs: left,
        totalHoldMs: (hold.totalHoldMs || 0) + add,
        sessionStart: null
      }).then(() => toast("已暂停")).catch((e) => toast("失败：" + e.message));
    }
    function doHoldAdd(mins) {
      if (!Number.isFinite(mins) || mins < 1) return toast("请输入有效分钟数");
      const addMs = mins * 60 * 1000;
      if (hold.running && hold.endsAt) {
        const newEnds = hold.endsAt + addMs;
        holdRef.update({ endsAt: newEnds, remainingMs: Math.max(0, newEnds - Date.now()) });
      } else {
        holdRef.update({ remainingMs: (hold.remainingMs || 0) + addMs, running: false, endsAt: null });
      }
      toast("已加时 " + mins + " 分钟");
    }

    function doBanStart() {
      const left = remaining(ban);
      if (left <= 0) return toast("请先加时");
      if (ban.running) return;
      const now = Date.now();
      banRef.update({
        running: true,
        endsAt: now + left,
        remainingMs: left,
        sessionStart: now
      }).then(() => toast("开始禁止高潮倒计时")).catch((e) => toast("失败：" + e.message));
    }
    function doBanPause() {
      if (!ban.running) return;
      const left = remaining(ban);
      const add = ban.sessionStart ? Math.max(0, Date.now() - ban.sessionStart) : 0;
      banRef.update({
        running: false,
        endsAt: null,
        remainingMs: left,
        totalBanMs: (ban.totalBanMs || 0) + add,
        sessionStart: null
      }).then(() => toast("已暂停")).catch((e) => toast("失败：" + e.message));
    }
    function doBanAdd(mins) {
      if (!Number.isFinite(mins) || mins < 1) return toast("请输入有效分钟数");
      const addMs = mins * 60 * 1000;
      if (ban.running && ban.endsAt) {
        const newEnds = ban.endsAt + addMs;
        banRef.update({ endsAt: newEnds, remainingMs: Math.max(0, newEnds - Date.now()) });
      } else {
        banRef.update({ remainingMs: (ban.remainingMs || 0) + addMs, running: false, endsAt: null });
      }
      toast("已加时 " + mins + " 分钟");
    }

    function feedWater() {
      if (!uid) return toast("请稍等，正在识别身份…");
      if (myLastFeed && Date.now() - myLastFeed < WEEK_MS) return toast("本周已经喂过啦");
      feedsRef.child(uid).set(Date.now())
        .then(() => waterRef.child("tankMl").transaction((cur) => (Number(cur) || 0) + FEED_ML))
        .then(() => toast("已喂黎奈 +50ml 水💧"))
        .catch((e) => toast("喂水失败：" + e.message));
    }

    function doDrink(ml) {
      if (!Number.isFinite(ml) || ml < 1) return toast("请输入要喝掉的 ml 数量");
      waterRef.transaction((cur) => {
        const tank = Math.max(0, Number(cur && cur.tankMl) || 0);
        const drunk = Math.max(0, Number(cur && cur.totalDrunkMl) || 0);
        const take = Math.min(tank, ml);
        return { tankMl: tank - take, totalDrunkMl: drunk + take };
      }).then((res) => {
        if (!res.committed) return toast("喝水未成功，请重试");
        const v = res.snapshot.val() || {};
        toast("已喝掉，剩余待喝 " + (v.tankMl || 0) + " ml");
      }).catch((e) => toast("喝水失败：" + e.message + "（检查数据库规则是否允许写入 linai/water）"));
    }

    // —— 留言 ——
    function sendMessage() {
      if (!uid) return toast("请稍等…");
      const text = (document.getElementById("msgInput").value || "").trim();
      if (!text) return toast("留言不能为空");
      if (/https?:\/\/\S+\.(png|jpe?g|gif|webp|bmp)/i.test(text)) return toast("不允许发送图片链接");
      const nick = (document.getElementById("nickInput").value || "").trim() || "匿名";
      const replyTo = document.getElementById("msgInput").dataset.replyTo || null;
      msgRef.push({
        text: text.slice(0, 500),
        nick: nick.slice(0, 16),
        uid,
        createdAt: Date.now(),
        likes: {},
        replyTo
      }).then(() => {
        document.getElementById("msgInput").value = "";
        document.getElementById("msgInput").dataset.replyTo = "";
        toast("已发送");
      }).catch((e) => toast("发送失败：" + e.message));
    }
    function likeMessage(id) {
      if (!uid) return;
      const likeRef = msgRef.child(id).child("likes").child(uid);
      likeRef.once("value").then((snap) => { snap.exists() ? likeRef.remove() : likeRef.set(true); });
    }
    function replyMessage(id, nick) {
      document.getElementById("msgInput").value = "@" + (nick || "") + " ";
      document.getElementById("msgInput").dataset.replyTo = id;
      document.getElementById("msgInput").focus();
    }
    function deleteMessage(id, ownerUid) {
      if (!uid) return;
      if (ownerUid === uid) {
        msgRef.child(id).remove().then(() => toast("已删除"));
        return;
      }
      openModal("deleteAny", id);
    }
    function doDeleteAny(id) {
      if (!id) return;
      msgRef.child(id).remove().then(() => toast("站长已删除")).catch((e) => toast(e.message));
    }
    function renderMessages(list) {
      const box = document.getElementById("msgList");
      if (!list.length) {
        box.innerHTML = '<div class="hint">还没有留言，来第一条吧～</div>';
        return;
      }
      const byId = {};
      list.forEach((m) => { byId[m.id] = m; });
      const roots = list.filter((m) => !m.replyTo || !byId[m.replyTo]);
      const ordered = [];
      roots.sort((a, b) => b.createdAt - a.createdAt).forEach((r) => {
        ordered.push(r);
        list.filter((x) => x.replyTo === r.id).sort((a, b) => a.createdAt - b.createdAt).forEach((x) => ordered.push(x));
      });
      box.innerHTML = ordered.map((m) => {
        const likeCount = m.likes ? Object.keys(m.likes).length : 0;
        const canDelSelf = m.uid === uid;
        const time = new Date(m.createdAt).toLocaleString();
        return '<div class="msg' + (m.replyTo ? " reply" : "") + '">' +
          '<div class="meta">' + esc(m.nick || "匿名") + " · " + time + (m.replyTo ? " · 回复" : "") + "</div>" +
          '<div class="body">' + esc(m.text) + "</div>" +
          '<div class="actions">' +
          '<button class="btn-like" onclick="likeMessage(\'' + m.id + '\')">点赞 ' + likeCount + "</button>" +
          '<button class="btn-ghost" onclick="replyMessage(\'' + m.id + '\',\'' + esc(m.nick || "") + '\')">回复</button>' +
          (canDelSelf
            ? '<button class="btn-del" onclick="deleteMessage(\'' + m.id + '\',\'' + m.uid + '\')">删除</button>'
            : '<button class="btn-del" onclick="deleteMessage(\'' + m.id + '\',\'' + m.uid + '\')">站长删除</button>') +
          "</div></div>";
      }).join("");
    }

    // —— 监听 ——
    holdRef.on("value", (snap) => {
      const v = snap.val();
      if (!v) {
        holdRef.set({ remainingMs: 0, running: false, endsAt: null, totalHoldMs: 0, sessionStart: null });
        return;
      }
      hold = {
        remainingMs: v.remainingMs || 0,
        running: !!v.running,
        endsAt: v.endsAt || null,
        totalHoldMs: v.totalHoldMs || 0,
        sessionStart: v.sessionStart || null
      };
      // 若云端说在跑但没有 sessionStart，补一个（兼容旧数据）
      if (hold.running && !hold.sessionStart) {
        hold.sessionStart = Date.now();
      }
      render();
    });
    banRef.on("value", (snap) => {
      const v = snap.val();
      if (!v) {
        banRef.set({ remainingMs: 0, running: false, endsAt: null, totalBanMs: 0, sessionStart: null });
        return;
      }
      ban = {
        remainingMs: v.remainingMs || 0,
        running: !!v.running,
        endsAt: v.endsAt || null,
        totalBanMs: v.totalBanMs || 0,
        sessionStart: v.sessionStart || null
      };
      if (ban.running && !ban.sessionStart) ban.sessionStart = Date.now();
      render();
    });
    waterRef.on("value", (snap) => {
      const v = snap.val() || {};
      water = {
        tankMl: Number(v.tankMl) || 0,
        totalDrunkMl: Number(v.totalDrunkMl) || 0
      };
      render();
    });
    feedsRef.on("value", (snap) => {
      const v = snap.val() || {};
      myLastFeed = uid && v[uid] ? Number(v[uid]) : 0;
      render();
    });
    msgRef.orderByChild("createdAt").limitToLast(80).on("value", (snap) => {
      const list = [];
      snap.forEach((c) => list.push({ id: c.key, ...(c.val() || {}) }));
      renderMessages(list);
    });

    auth.onAuthStateChanged((user) => {
      if (user) {
        uid = user.uid;
        document.getElementById("sync").textContent = "● 全网同步中";
        document.getElementById("sync").className = "sync ok";
        // 重新读一次自己的喂水记录
        feedsRef.child(uid).once("value").then((s) => {
          myLastFeed = s.val() ? Number(s.val()) : 0;
          render();
        });
      }
    });
    auth.signInAnonymously().catch((e) => {
      document.getElementById("sync").textContent = "登录失败（请开启匿名登录）";
      document.getElementById("sync").className = "sync err";
      toast("匿名登录失败：" + e.message);
    });

    // 本地每 250ms 刷新显示（倒计时数字 + 平滑累计），不写库
    setInterval(render, 250);

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
      if (e.key === "Enter" && document.getElementById("modal").classList.contains("show")) confirmModal();
    });
  </script>
</body>
</html>
