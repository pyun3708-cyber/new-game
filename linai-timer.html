<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>黎奈同学的憋尿计时器🖤~</title>
  <style>
    :root {
      --pink-deep: #ff5a9a;
      --pink-bg1: #fff0f6;
      --pink-bg2: #ffd6e7;
      --text: #5a2a3c;
      --card: rgba(255, 255, 255, 0.72);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      color: var(--text);
      background: linear-gradient(165deg, var(--pink-bg1) 0%, #ffc1d9 45%, var(--pink-bg2) 100%);
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
    }
    a.back {
      align-self: flex-start;
      color: var(--pink-deep);
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 12px;
      opacity: 0.9;
    }
    a.back:hover { opacity: 1; text-decoration: underline; }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 28px;
      box-shadow: 0 16px 48px rgba(255, 90, 154, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.7);
      padding: 28px 22px 26px;
      text-align: center;
    }
    .avatar-wrap {
      width: 128px;
      height: 128px;
      margin: 0 auto 16px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, #ff9ec4, #ff5a9a, #ffb6d9);
      box-shadow: 0 8px 24px rgba(255, 90, 154, 0.35);
    }
    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      background: #fff;
    }
    h1 {
      font-size: 1.25rem;
      line-height: 1.45;
      margin-bottom: 6px;
      color: #c2185b;
      font-weight: 700;
    }
    .sub {
      font-size: 13px;
      color: #a05a78;
      margin-bottom: 18px;
      line-height: 1.5;
    }
    .sync-badge {
      display: inline-block;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 14px;
      background: rgba(255,255,255,0.75);
      color: #9c4068;
    }
    .sync-badge.ok { color: #2e7d32; background: rgba(76,175,80,0.18); }
    .sync-badge.err { color: #c62828; background: rgba(198,40,40,0.12); }
    .timer {
      font-variant-numeric: tabular-nums;
      font-size: clamp(2.4rem, 10vw, 3.2rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #ad1457;
      margin: 8px 0 6px;
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.6);
    }
    .timer.zero { color: #2e7d32; }
    .status {
      display: inline-block;
      font-size: 13px;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 22px;
      background: rgba(255, 255, 255, 0.7);
      color: #9c4068;
    }
    .status.running {
      background: rgba(255, 90, 154, 0.18);
      color: #c2185b;
      animation: pulse 1.6s ease-in-out infinite;
    }
    .status.done {
      background: rgba(76, 175, 80, 0.2);
      color: #2e7d32;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.65; }
    }
    .btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .btns .full { grid-column: 1 / -1; }
    button {
      border: none;
      border-radius: 16px;
      padding: 14px 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.12s ease, opacity 0.12s;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { transform: scale(0.97); }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }
    .btn-start {
      background: linear-gradient(135deg, #ff7eb3, #ff4d94);
      color: #fff;
      box-shadow: 0 6px 18px rgba(255, 77, 148, 0.4);
    }
    .btn-pause {
      background: linear-gradient(135deg, #f5d0e0, #e8a8c4);
      color: #7a304e;
    }
    .btn-add {
      background: linear-gradient(135deg, #2b2b2b, #4a4a4a);
      color: #ffb6d9;
    }
    .hint {
      margin-top: 18px;
      font-size: 12px;
      color: #b07090;
      line-height: 1.55;
    }
    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(80, 20, 50, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 20px;
    }
    .modal-mask.show { display: flex; }
    .modal {
      width: 100%;
      max-width: 340px;
      background: #fff;
      border-radius: 20px;
      padding: 22px 18px 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
      text-align: left;
    }
    .modal h2 {
      font-size: 17px;
      color: #c2185b;
      margin-bottom: 12px;
      text-align: center;
    }
    .modal label {
      display: block;
      font-size: 13px;
      color: #8a4a66;
      margin: 10px 0 6px;
    }
    .modal input {
      width: 100%;
      border: 1.5px solid #f5b6d0;
      border-radius: 12px;
      padding: 11px 12px;
      font-size: 16px;
      outline: none;
      font-family: inherit;
    }
    .modal input:focus { border-color: #ff5a9a; }
    .modal .row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .modal .row button { flex: 1; }
    .btn-cancel { background: #f3e4eb; color: #7a4058; }
    .btn-ok {
      background: linear-gradient(135deg, #ff7eb3, #ff4d94);
      color: #fff;
    }
    .err {
      color: #d32f2f;
      font-size: 12px;
      margin-top: 8px;
      min-height: 16px;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%) translateY(20px);
      background: rgba(50, 20, 35, 0.88);
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 60;
      max-width: 90%;
      text-align: center;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <a class="back" href="index.html">← 返回草莓酱的个人主页</a>

  <div class="card">
    <div class="avatar-wrap">
      <img src="linai-avatar.jpg" alt="黎奈" />
    </div>
    <h1>黎奈同学的憋尿计时器🖤~</h1>
    <p class="sub">倒计时憋尿 · 全网同步 · 归零才可以尿尿哦❤</p>
    <div class="sync-badge" id="syncBadge">正在连接 Firebase…</div>

    <div class="timer" id="display">00:00:00</div>
    <div class="status" id="status">加载中…</div>

    <div class="btns">
      <button type="button" class="btn-start" id="btnStart" onclick="onStart()" disabled>开始❤</button>
      <button type="button" class="btn-pause" id="btnPause" onclick="onPause()" disabled>暂停</button>
      <button type="button" class="btn-add full" id="btnAdd" onclick="openAddModal()">加时🖤</button>
    </div>

    <p class="hint">
      这是<strong>倒计时</strong>：数字会往下走。<br />
      所有人看到的是同一份时间（Firebase 实时同步）。<br />
      只能加时和暂停，不能主动减少时间❤<br />
      时间归零后，才可以尿尿～
    </p>
  </div>

  <div class="modal-mask" id="addModal" onclick="if(event.target===this)closeAddModal()">
    <div class="modal">
      <h2>加时🖤</h2>
      <label>密码</label>
      <input type="password" id="pwdInput" placeholder="请输入密码" autocomplete="off" />
      <label>增加时长（分钟）</label>
      <input type="number" id="minsInput" min="1" step="1" placeholder="例如 10" />
      <div class="err" id="addErr"></div>
      <div class="row">
        <button type="button" class="btn-cancel" onclick="closeAddModal()">取消</button>
        <button type="button" class="btn-ok" onclick="confirmAdd()">确认加时</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Firebase Compat SDK（单文件 HTML 最省事） -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBeOpIqMdvV3N7jTrXZwGZxQprPLtoDAy0",
      authDomain: "planning-with-ai-5a793.firebaseapp.com",
      databaseURL: "https://planning-with-ai-5a793-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "planning-with-ai-5a793",
      storageBucket: "planning-with-ai-5a793.firebasestorage.app",
      messagingSenderId: "1092542525478",
      appId: "1:1092542525478:web:a044a52e4334c496e676e7"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const ref = db.ref("linaiTimer");

    const ADD_PASSWORD = "1314";

    // remainingMs: 暂停时的剩余毫秒
    // running: 是否在跑
    // endsAt: 运行中归零的时间戳
    let state = { remainingMs: 0, running: false, endsAt: null };
    let tickTimer = null;
    let zeroAnnounced = false;
    let ready = false;

    function remainingNow() {
      if (state.running && state.endsAt) {
        return Math.max(0, state.endsAt - Date.now());
      }
      return Math.max(0, state.remainingMs || 0);
    }

    function formatMs(ms) {
      const totalSec = Math.floor(ms / 1000);
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      const pad = (n) => String(n).padStart(2, "0");
      return pad(h) + ":" + pad(m) + ":" + pad(s);
    }

    function pushState(patch) {
      return ref.update(patch);
    }

    function render() {
      const left = remainingNow();
      const display = document.getElementById("display");
      const status = document.getElementById("status");
      const btnStart = document.getElementById("btnStart");
      const btnPause = document.getElementById("btnPause");

      display.textContent = formatMs(left);

      if (left <= 0) {
        display.classList.add("zero");
        status.textContent = "时间到 · 可以尿尿了💚";
        status.className = "status done";
        btnStart.disabled = true;
        btnStart.textContent = "开始❤";
        btnPause.disabled = true;
        if (state.running) {
          // 归零后写回云端，避免其他端还显示在跑
          state.running = false;
          state.endsAt = null;
          state.remainingMs = 0;
          pushState({ running: false, endsAt: null, remainingMs: 0 });
          stopTick();
        }
        if (!zeroAnnounced) {
          zeroAnnounced = true;
          toast("时间归零啦，可以尿尿了💚");
        }
        return;
      }

      zeroAnnounced = false;
      display.classList.remove("zero");

      if (state.running) {
        status.textContent = "憋尿倒计时中…坚持住🖤";
        status.className = "status running";
        btnStart.disabled = true;
        btnPause.disabled = false;
      } else {
        status.textContent = "已暂停 · 剩余 " + formatMs(left);
        status.className = "status";
        btnStart.disabled = false;
        btnStart.textContent = "继续❤";
        btnPause.disabled = true;
      }
    }

    function startTick() {
      stopTick();
      tickTimer = setInterval(render, 200);
    }
    function stopTick() {
      if (tickTimer) {
        clearInterval(tickTimer);
        tickTimer = null;
      }
    }

    function onStart() {
      if (!ready) return toast("还在连接，稍等一下");
      const left = remainingNow();
      if (left <= 0) return toast("请先加时再开始哦");
      if (state.running) return;
      const endsAt = Date.now() + left;
      pushState({ running: true, endsAt: endsAt, remainingMs: left })
        .then(() => toast("开始倒计时❤ 坚持住"))
        .catch((e) => toast("同步失败：" + e.message));
    }

    function onPause() {
      if (!ready || !state.running) return;
      const left = remainingNow();
      pushState({ running: false, endsAt: null, remainingMs: left })
        .then(() => toast("已暂停"))
        .catch((e) => toast("同步失败：" + e.message));
    }

    function openAddModal() {
      document.getElementById("pwdInput").value = "";
      document.getElementById("minsInput").value = "";
      document.getElementById("addErr").textContent = "";
      document.getElementById("addModal").classList.add("show");
      setTimeout(() => document.getElementById("pwdInput").focus(), 50);
    }
    function closeAddModal() {
      document.getElementById("addModal").classList.remove("show");
    }

    function confirmAdd() {
      const pwd = document.getElementById("pwdInput").value;
      const mins = parseInt(document.getElementById("minsInput").value, 10);
      const err = document.getElementById("addErr");
      if (pwd !== ADD_PASSWORD) {
        err.textContent = "密码不对哦";
        return;
      }
      if (!Number.isFinite(mins) || mins < 1) {
        err.textContent = "请输入至少 1 分钟";
        return;
      }
      if (!ready) {
        err.textContent = "还在连接，稍等一下";
        return;
      }
      const addMs = mins * 60 * 1000;
      let patch;
      if (state.running && state.endsAt) {
        const newEnds = state.endsAt + addMs;
        patch = {
          endsAt: newEnds,
          remainingMs: Math.max(0, newEnds - Date.now()),
          running: true
        };
      } else {
        patch = {
          remainingMs: Math.max(0, state.remainingMs || 0) + addMs,
          endsAt: null,
          running: false
        };
      }
      zeroAnnounced = false;
      pushState(patch)
        .then(() => {
          closeAddModal();
          toast("已加时 " + mins + " 分钟🖤");
        })
        .catch((e) => {
          err.textContent = "同步失败：" + e.message;
        });
    }

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove("show"), 2200);
    }

    function setSyncBadge(ok, text) {
      const el = document.getElementById("syncBadge");
      el.textContent = text;
      el.className = "sync-badge " + (ok === true ? "ok" : ok === false ? "err" : "");
    }

    // 实时监听云端状态
    ref.on(
      "value",
      (snap) => {
        const val = snap.val();
        if (!val) {
          // 首次：初始化一条数据
          ref.set({ remainingMs: 0, running: false, endsAt: null });
          return;
        }
        state = {
          remainingMs: typeof val.remainingMs === "number" ? val.remainingMs : 0,
          running: !!val.running,
          endsAt: typeof val.endsAt === "number" ? val.endsAt : null
        };
        // 若已过期，纠正为归零
        if (state.running && state.endsAt && Date.now() >= state.endsAt) {
          state.remainingMs = 0;
          state.running = false;
          state.endsAt = null;
          pushState({ remainingMs: 0, running: false, endsAt: null });
        }
        ready = true;
        setSyncBadge(true, "● 全网同步中");
        if (state.running) startTick();
        else stopTick();
        render();
      },
      (err) => {
        ready = false;
        setSyncBadge(false, "连接失败：" + err.message);
        document.getElementById("status").textContent = "无法连接数据库";
      }
    );

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") closeAddModal();
      if (e.key === "Enter" && document.getElementById("addModal").classList.contains("show")) {
        confirmAdd();
      }
    });
  </script>
</body>
</html>
