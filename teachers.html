<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>老师介绍 · 反媚黑高校</title>
<style>
:root{--bg:#f7f3ee;--card:#fff;--ink:#292824;--muted:#6a655c;--accent:#c45c7a;--line:#e8e0d4}
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden}
header{padding:14px 16px;border-bottom:1px solid var(--line);background:#fff;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;position:relative;z-index:5}
h1{font-size:18px;margin:0;letter-spacing:.06em}
.sub{font-size:12px;color:var(--muted)}
a{color:var(--accent);text-decoration:none}
.search{display:flex;gap:8px;flex-wrap:wrap}
.search input{padding:8px 12px;border:1px solid var(--line);border-radius:8px;min-width:180px;font:inherit}
.search button,.btn{padding:8px 14px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font:inherit}
.btn.ghost{background:#fff;color:var(--accent);border:1px solid var(--accent)}
.btn.danger{background:#b33}
.btn:disabled{opacity:.4;cursor:not-allowed}
.rail{display:flex;gap:20px;padding:20px 16px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;position:relative;z-index:2}
.card{flex:0 0 min(320px,85vw);scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 6px 20px rgba(0,0,0,.04)}
.card .meta{font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.5}
.card .meta a{font-weight:600}
.cert-wrap{position:relative;width:100%;min-height:180px;background:#1a1020;border-radius:8px;overflow:hidden;line-height:0}
.cert-wrap img.cert{width:100%;height:auto;display:block;background:#1a1020;object-fit:contain}
.cert-wrap .cert-ph{color:#aaa;padding:48px 16px;text-align:center;line-height:1.5;font-size:13px}
.cert-wrap canvas.draw{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;cursor:crosshair;background:transparent}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;align-items:center}
.tools label{font-size:12px;color:var(--muted)}
.comments{margin-top:8px;max-height:160px;overflow:auto;font-size:13px;border-top:1px solid var(--line);padding-top:8px}
.comment{padding:6px 0;border-bottom:1px dashed var(--line)}
.comment .who{color:var(--accent);font-weight:600;font-size:12px}
.comment .when{color:var(--muted);font-size:11px;margin-left:6px}
.compose{display:flex;gap:6px;margin-top:8px}
.compose input{flex:1;padding:8px;border:1px solid var(--line);border-radius:8px;font:inherit}
.empty{padding:40px;text-align:center;color:var(--muted)}
.status{font-size:12px;color:var(--muted);padding:0 16px 12px;position:relative;z-index:2}
.pager{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:12px 16px 28px;position:relative;z-index:2}
.pager .info{font-size:13px;color:var(--muted)}
#danmakuLayer{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.danmaku{position:absolute;white-space:nowrap;font-weight:700;color:var(--accent);text-shadow:0 0 4px #fff,0 1px 2px rgba(0,0,0,.25);will-change:transform;pointer-events:none;animation:danmakuMove linear forwards}
@keyframes danmakuMove{from{transform:translateX(0)}to{transform:translateX(calc(-100vw - 100%))}}
</style>
</head>
<body>
<div id="danmakuLayer"></div>
<header>
  <div>
    <h1>老师介绍 ♠</h1>
    <div class="sub">自愿公开展示 · 每页 20 位 · 证书图按需加载</div>
  </div>
  <div class="search">
    <input id="q" placeholder="输入教师编号 如 202600001" maxlength="12">
    <button type="button" id="btnSearch">查找</button>
    <a class="btn ghost" href="school.html">返回官网</a>
  </div>
</header>
<div class="status" id="status">加载中…</div>
<div class="rail" id="rail"></div>
<div class="pager" id="pager" style="display:none">
  <button type="button" class="btn ghost" id="btnPrev">上一页</button>
  <span class="info" id="pageInfo">第 1 页</span>
  <button type="button" class="btn ghost" id="btnNext">下一页</button>
</div>
<script>
const API = "https://school-auth.pyun3708.workers.dev";
const ADMIN_NAMES = ["草莓酱", "strawberry", "admin"];
const PAGE_SIZE = 20;
let page = 1;
let searchCert = "";
let totalCount = 0;
function token(){ return localStorage.getItem("school_token") || ""; }
function me(){ try { return JSON.parse(localStorage.getItem("school_user")||"null"); } catch(e){ return null; } }
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return ({"&":"&","<":"<",">":">","\"":""","'":"&#39;"})[c];
  });
}
function isAdmin(){
  const u = me();
  if (!u) return false;
  const name = (u.username || u.display_name || "").trim();
  return ADMIN_NAMES.indexOf(name) >= 0 || u.role === "admin";
}
async function api(path, opts){
  opts = opts || {};
  const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
  if (token()) headers.Authorization = "Bearer " + token();
  const res = await fetch(API + path, Object.assign({}, opts, { headers: headers }));
  const data = await res.json().catch(function(){ return {}; });
  if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
  return data;
}
async function loadList(certNo, resetPage){
  const st = document.getElementById("status");
  if (typeof certNo === "string") searchCert = certNo;
  if (resetPage !== false) page = 1;
  st.textContent = "加载中…";
  try {
    var q = [];
    if (searchCert) q.push("cert_no=" + encodeURIComponent(searchCert));
    q.push("page=" + page);
    q.push("limit=" + PAGE_SIZE);
    q.push("light=1");
    const data = await api("/teachers/public?" + q.join("&"));
    var items = data.items || [];
    totalCount = (typeof data.total === "number") ? data.total : items.length;
    var totalPages = Math.max(1, Math.ceil(totalCount / PAGE_SIZE));
    if (page > totalPages) page = totalPages;
    st.textContent = totalCount
      ? ("共 " + totalCount + " 位自愿展示 · 第 " + page + " / " + totalPages + " 页")
      : "暂无公开展示的教师资格证";
    renderPage(items, totalPages);
  } catch (e) {
    st.textContent = "加载失败：" + (e.message || e);
    document.getElementById("rail").innerHTML = "<div class='empty'>" + esc(e.message || e) + "</div>";
    document.getElementById("pager").style.display = "none";
  }
}
function renderPage(pageItems, totalPages){
  const rail = document.getElementById("rail");
  const pager = document.getElementById("pager");
  const pageInfo = document.getElementById("pageInfo");
  const btnPrev = document.getElementById("btnPrev");
  const btnNext = document.getElementById("btnNext");
  if (!pageItems.length) {
    rail.innerHTML = "<div class='empty'>还没有老师选择公开展示资格证</div>";
    pager.style.display = totalPages > 1 ? "flex" : "none";
    return;
  }
  rail.innerHTML = "";
  for (var i = 0; i < pageItems.length; i++) rail.appendChild(buildCard(pageItems[i]));
  if (totalPages > 1) {
    pager.style.display = "flex";
    pageInfo.textContent = "第 " + page + " / " + totalPages + " 页";
    btnPrev.disabled = page <= 1;
    btnNext.disabled = page >= totalPages;
  } else {
    pager.style.display = "none";
  }
  try { rail.scrollTo({ left: 0, behavior: "smooth" }); } catch(e) { rail.scrollLeft = 0; }
}
function buildCard(item){
  const card = document.createElement("div");
  card.className = "card";
  card.id = "cert-" + item.cert_no;
  const uname = item.username || item.display_name || "老师";
  var profileHref = "#";
  if (item.username) profileHref = "profile.html?u=" + encodeURIComponent(item.username);
  else if (item.user_id) profileHref = "profile.html?id=" + encodeURIComponent(item.user_id);
  card.innerHTML =
    '<div class="meta">编号 <b>' + esc(item.cert_no) + '</b><br>账号 <a href="' + profileHref + '">' + esc(uname) + '</a>' +
    (item.course ? (' · 课程 ' + esc(item.course)) : '') + '</div>' +
    '<div class="cert-wrap" data-cert="' + esc(item.cert_no) + '">' +
    '<div class="cert-ph">证书加载中…</div>' +
    '<canvas class="draw"></canvas></div>' +
    '<div class="tools">' +
    '<label>画笔 <input type="color" class="pen" value="#e91e63"></label>' +
    '<button type="button" class="btn ghost btn-save-draw">保存涂鸦</button>' +
    '<button type="button" class="btn ghost btn-clear-local">清空本地</button>' +
    (isAdmin() ? '<button type="button" class="btn danger btn-admin-del">管理员下架</button>' : '') +
    '</div>' +
    '<div class="comments"><div class="sub">评论加载中…</div></div>' +
    '<div class="compose"><input placeholder="说点什么…" maxlength="200"><button type="button" class="btn btn-cmt">评论</button></div>';
  const wrap = card.querySelector(".cert-wrap");
  const canvas = card.querySelector("canvas.draw");
  function startDraw(drawing){ setupCanvas(canvas, wrap, drawing || ""); }
  (async function(){
    try {
      var imgData = item.cert_image || "";
      var drawing = item.drawing || "";
      if (!imgData) {
        var detail = await api("/teachers/public?cert_no=" + encodeURIComponent(item.cert_no));
        var one = (detail.items || [])[0];
        if (one) { imgData = one.cert_image || ""; drawing = one.drawing || ""; }
      }
      var ph = wrap.querySelector(".cert-ph");
      if (imgData) {
        var im = document.createElement("img");
        im.className = "cert"; im.alt = "资格证"; im.decoding = "async";
        im.onload = function(){ startDraw(drawing); };
        im.onerror = function(){ if (ph) ph.textContent = "证书图损坏"; startDraw(drawing); };
        if (ph) ph.replaceWith(im); else wrap.insertBefore(im, canvas);
        im.src = imgData;
      } else {
        if (ph) ph.textContent = "暂无证书图";
        startDraw(drawing);
      }
    } catch (e) {
      var ph2 = wrap.querySelector(".cert-ph");
      if (ph2) ph2.textContent = "证书加载失败";
      startDraw("");
    }
  })();
  card.querySelector(".btn-save-draw").onclick = async function(){
    try {
      if (!token()) { alert("请先登录再涂鸦"); return; }
      var dataUrl = canvas.toDataURL("image/jpeg", 0.75);
      await api("/teachers/draw", { method:"POST", body: JSON.stringify({ cert_no: item.cert_no, image: dataUrl }) });
      alert("涂鸦已保存（约每周自动清理一次）");
    } catch (e) { alert(e.message); }
  };
  card.querySelector(".btn-clear-local").onclick = function(){
    var ctx = canvas.getContext("2d");
    ctx.clearRect(0,0,canvas.width,canvas.height);
  };
  var del = card.querySelector(".btn-admin-del");
  if (del) del.onclick = async function(){
    if (!confirm("确定下架该教师资格证展示？")) return;
    try {
      await api("/teachers/unpublish", { method:"POST", body: JSON.stringify({ cert_no: item.cert_no }) });
      await loadList(searchCert, false);
    } catch (e) { alert(e.message); }
  };
  var cbox = card.querySelector(".comments");
  setTimeout(function(){ loadComments(item.cert_no, cbox); }, 30);
  card.querySelector(".btn-cmt").onclick = async function(){
    var inp = card.querySelector(".compose input");
    var text = (inp.value || "").trim();
    if (!text) return;
    try {
      if (!token()) { alert("请先登录再评论"); return; }
      await api("/teachers/comment", { method:"POST", body: JSON.stringify({ cert_no: item.cert_no, content: text }) });
      inp.value = "";
      loadComments(item.cert_no, cbox);
      refreshDanmakuPool();
    } catch (e) { alert(e.message); }
  };
  return card;
}
function setupCanvas(canvas, wrap, drawingDataUrl){
  function fit(){
    var r = wrap.getBoundingClientRect();
    if (r.width < 10 || r.height < 10) return;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.floor(r.width * dpr));
    canvas.height = Math.max(1, Math.floor(r.height * dpr));
    canvas.style.width = r.width + "px";
    canvas.style.height = r.height + "px";
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,r.width,r.height);
    if (drawingDataUrl) {
      var im = new Image();
      im.onload = function(){ ctx.drawImage(im, 0, 0, r.width, r.height); };
      im.src = drawingDataUrl;
    }
  }
  fit();
  window.addEventListener("resize", fit);
  var drawing = false, last = null;
  function pos(e){
    var r = canvas.getBoundingClientRect();
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }
  function start(e){ drawing = true; last = pos(e); e.preventDefault(); }
  function move(e){
    if (!drawing) return;
    var p = pos(e);
    var pen = canvas.parentElement.parentElement.querySelector(".pen");
    var c = canvas.getContext("2d");
    c.strokeStyle = pen ? pen.value : "#e91e63";
    c.lineWidth = 2.5;
    c.lineCap = "round";
    c.beginPath();
    c.moveTo(last.x, last.y);
    c.lineTo(p.x, p.y);
    c.stroke();
    last = p;
    e.preventDefault();
  }
  function end(){ drawing = false; }
  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  window.addEventListener("mouseup", end);
  canvas.addEventListener("touchstart", start, {passive:false});
  canvas.addEventListener("touchmove", move, {passive:false});
  canvas.addEventListener("touchend", end);
}
async function loadComments(certNo, box){
  box.innerHTML = "加载评论…";
  try {
    var data = await api("/teachers/comments?cert_no=" + encodeURIComponent(certNo));
    var items = data.items || [];
    if (!items.length) { box.innerHTML = "<div class='sub'>还没有评论</div>"; return; }
    box.innerHTML = items.map(function(c){
      return '<div class="comment"><span class="who">' + esc(c.username||"用户") + '</span>' +
        '<span class="when">' + esc(c.created_at||"") + '</span><div>' + esc(c.content) + '</div></div>';
    }).join("");
  } catch (e) {
    box.innerHTML = "<div class='sub'>评论加载失败</div>";
  }
}
var danmakuPool = [];
async function refreshDanmakuPool(){
  try {
    var data = await api("/teachers/danmaku");
    danmakuPool = (data.items || []).map(function(x){
      return (x.username ? (x.username + "：") : "") + (x.content || "");
    }).filter(Boolean);
  } catch (e) {}
}
function spawnDanmaku(){
  if (!danmakuPool.length) return;
  var text = danmakuPool[Math.floor(Math.random() * danmakuPool.length)];
  var layer = document.getElementById("danmakuLayer");
  if (!layer) return;
  var el = document.createElement("div");
  el.className = "danmaku";
  el.textContent = text;
  var size = 14 + Math.floor(Math.random() * 18);
  var top = 8 + Math.random() * 70;
  var dur = 8 + Math.random() * 8;
  el.style.fontSize = size + "px";
  el.style.top = top + "vh";
  el.style.left = "100vw";
  el.style.animationDuration = dur + "s";
  layer.appendChild(el);
  setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, dur * 1000 + 200);
}
document.getElementById("btnSearch").onclick = function(){
  loadList(document.getElementById("q").value.trim(), true);
};
document.getElementById("q").onkeydown = function(e){
  if (e.key === "Enter") document.getElementById("btnSearch").click();
};
document.getElementById("btnPrev").onclick = function(){
  if (page > 1) { page -= 1; loadList(searchCert, false); }
};
document.getElementById("btnNext").onclick = function(){
  page += 1; loadList(searchCert, false);
};
loadList("", true);
refreshDanmakuPool();
setInterval(spawnDanmaku, 10000);
setInterval(refreshDanmakuPool, 30000);
</script>
</body>
</html>
