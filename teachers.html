<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>老师介绍 · 反媚黑高校</title>
<style>
:root{--bg:#f7f3ee;--card:#fff;--ink:#292824;--muted:#6a655c;--accent:#c45c7a;--line:#e8e0d4}
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden}
header{padding:14px 16px;border-bottom:1px solid var(--line);background:#fff;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;position:relative;z-index:5}
h1{font-size:18px;margin:0;letter-spacing:.06em}
.sub{font-size:12px;color:var(--muted)}
a{color:var(--accent);text-decoration:none}
.search{display:flex;gap:8px;flex-wrap:wrap}
.search input{padding:8px 12px;border:1px solid var(--line);border-radius:8px;min-width:180px;font:inherit}
.search button,.btn{padding:8px 14px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font:inherit}
.btn.ghost{background:#fff;color:var(--accent);border:1px solid var(--accent)}
.btn.danger{background:#b33}
.rail{display:flex;gap:20px;padding:20px 16px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;position:relative;z-index:2}
.card{flex:0 0 min(320px,85vw);scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 6px 20px rgba(0,0,0,.04)}
.card .meta{font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.5}
.card .meta a{font-weight:600}
.cert-wrap{position:relative;width:100%;background:#1a1020;border-radius:8px;overflow:hidden;line-height:0}
.cert-wrap img.cert{width:100%;height:auto;display:block;vertical-align:top;background:#1a1020}
.cert-wrap canvas.draw{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;align-items:center}
.tools label{font-size:12px;color:var(--muted)}
.comments{margin-top:8px;max-height:160px;overflow:auto;font-size:13px;border-top:1px solid var(--line);padding-top:8px}
.comment{padding:6px 0;border-bottom:1px dashed var(--line)}
.comment .who{color:var(--accent);font-weight:600;font-size:12px}
.comment .when{color:var(--muted);font-size:11px;margin-left:6px}
.compose{display:flex;gap:6px;margin-top:8px}
.compose input{flex:1;padding:8px;border:1px solid var(--line);border-radius:8px;font:inherit}
.empty{padding:40px;text-align:center;color:var(--muted)}
.status{font-size:12px;color:var(--muted);padding:0 16px 12px;position:relative;z-index:2}
#danmakuLayer{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.danmaku{
  position:absolute;white-space:nowrap;font-weight:700;color:var(--accent);
  text-shadow:0 0 4px #fff, 0 1px 2px rgba(0,0,0,.25);
  will-change:transform;pointer-events:none;
  animation: danmakuMove linear forwards;
}
@keyframes danmakuMove{
  from{transform:translateX(0)}
  to{transform:translateX(calc(-100vw - 100%))}
}
</style>
</head>
<body>
<div id="danmakuLayer"></div>
<header>
  <div>
    <h1>老师介绍 ♠</h1>
    <div class="sub">自愿公开展示的教师资格证 · 按编号从左到右 · 弹幕每秒随机一条</div>
  </div>
  <div class="search">
    <input id="q" placeholder="输入教师编号 如 202600001" maxlength="12">
    <button type="button" id="btnSearch">查找</button>
    <a class="btn ghost" href="school.html">返回官网</a>
  </div>
</header>
<div class="status" id="status">加载中…</div>
<div class="rail" id="rail"></div>

<script>
const API = "https://school-auth.pyun3708.workers.dev";
const ADMIN_NAMES = ["草莓酱", "strawberry", "admin"];

function token(){ return localStorage.getItem("school_token") || ""; }
function me(){ try { return JSON.parse(localStorage.getItem("school_user")||"null"); } catch { return null; } }
function esc(s){
  return String(s??"").replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}
function isAdmin(){
  const u = me();
  if (!u) return false;
  const name = (u.username || u.display_name || "").trim();
  return ADMIN_NAMES.includes(name) || u.role === "admin";
}
async function api(path, opts={}){
  const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers||{});
  if (token()) headers.Authorization = "Bearer " + token();
  const res = await fetch(API + path, Object.assign({}, opts, { headers }));
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.error || ("HTTP "+res.status));
  return data;
}

let list = [];
let danmakuPool = [];

async function loadList(certNo){
  const st = document.getElementById("status");
  st.textContent = "加载中…";
  try {
    const q = certNo ? ("?cert_no=" + encodeURIComponent(certNo)) : "";
    const data = await api("/teachers/public" + q);
    list = data.items || [];
    st.textContent = list.length ? ("共 " + list.length + " 位老师展示中") : "暂无公开展示的教师资格证";
    render();
  } catch (e) {
    st.textContent = "加载失败：" + e.message + "（请确认 Worker 已部署）";
    document.getElementById("rail").innerHTML = "<div class='empty'>" + esc(e.message) + "</div>";
  }
}

function render(){
  const rail = document.getElementById("rail");
  if (!list.length) {
    rail.innerHTML = "<div class='empty'>还没有老师选择公开展示资格证</div>";
    return;
  }
  rail.innerHTML = "";
  list.forEach(item => rail.appendChild(buildCard(item)));
}

function buildCard(item){
  const card = document.createElement("div");
  card.className = "card";
  card.id = "cert-" + item.cert_no;
  const profileHref = item.user_id ? ("profile.html?id=" + encodeURIComponent(item.user_id)) : "#";
  const uname = item.username || item.display_name || "老师";
  card.innerHTML =
    '<div class="meta">编号 <b>' + esc(item.cert_no) + '</b><br>账号 <a href="' + profileHref + '">' + esc(uname) + '</a>' +
    (item.course ? (' · 课程 ' + esc(item.course)) : '') + '</div>' +
    '<div class="cert-wrap" data-cert="' + esc(item.cert_no) + '">' +
    (item.cert_image ? ('<img class="cert" src="' + item.cert_image + '" alt="资格证">') : '<div style="color:#aaa;padding:20px;text-align:center;line-height:1.4">暂无证书图</div>') +
    '<canvas class="draw"></canvas></div>' +
    '<div class="tools">' +
    '<label>画笔 <input type="color" class="pen" value="#e91e63"></label>' +
    '<button type="button" class="btn ghost btn-save-draw">保存涂鸦</button>' +
    '<button type="button" class="btn ghost btn-clear-local">清空本地</button>' +
    (isAdmin() ? '<button type="button" class="btn danger btn-admin-del">管理员下架</button>' : '') +
    '</div>' +
    '<div class="comments"></div>' +
    '<div class="compose"><input placeholder="说点什么…" maxlength="200"><button type="button" class="btn btn-cmt">评论</button></div>';

  const wrap = card.querySelector(".cert-wrap");
  const canvas = card.querySelector("canvas.draw");
  const certImg = card.querySelector("img.cert");
  function startDraw(){ setupCanvas(canvas, wrap, item.drawing); }
  if (certImg) {
    if (certImg.complete && certImg.naturalHeight) startDraw();
    else certImg.onload = startDraw;
  } else startDraw();

  card.querySelector(".btn-save-draw").onclick = async () => {
    try {
      if (!token()) { alert("请先登录再涂鸦"); return; }
      const data = canvas.toDataURL("image/png");
      await api("/teachers/draw", { method:"POST", body: JSON.stringify({ cert_no: item.cert_no, image: data }) });
      alert("涂鸦已保存（约每周自动清理一次）");
    } catch (e) { alert(e.message); }
  };
  card.querySelector(".btn-clear-local").onclick = () => {
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0,0,canvas.width,canvas.height);
    if (item.drawing) {
      const im = new Image();
      im.onload = () => ctx.drawImage(im,0,0,canvas.width,canvas.height);
      im.src = item.drawing;
    }
  };
  const del = card.querySelector(".btn-admin-del");
  if (del) del.onclick = async () => {
    if (!confirm("确定下架该教师资格证展示？")) return;
    try {
      await api("/teachers/unpublish", { method:"POST", body: JSON.stringify({ cert_no: item.cert_no }) });
      await loadList();
    } catch (e) { alert(e.message); }
  };

  const cbox = card.querySelector(".comments");
  loadComments(item.cert_no, cbox);
  card.querySelector(".btn-cmt").onclick = async () => {
    const inp = card.querySelector(".compose input");
    const text = (inp.value || "").trim();
    if (!text) return;
    try {
      if (!token()) { alert("请先登录再评论"); return; }
      await api("/teachers/comment", { method:"POST", body: JSON.stringify({ cert_no: item.cert_no, content: text }) });
      inp.value = "";
      loadComments(item.cert_no, cbox);
      refreshDanmakuPool();
    } catch (e) { alert(e.message); }
  };

  return card;
}

function setupCanvas(canvas, wrap, drawingDataUrl){
  function fit(){
    const r = wrap.getBoundingClientRect();
    if (r.width < 10 || r.height < 10) return;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.floor(r.width * dpr));
    canvas.height = Math.max(1, Math.floor(r.height * dpr));
    canvas.style.width = r.width + "px";
    canvas.style.height = r.height + "px";
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr,0,0,dpr,0,0);
    if (drawingDataUrl) {
      const im = new Image();
      im.onload = () => ctx.drawImage(im, 0, 0, r.width, r.height);
      im.src = drawingDataUrl;
    }
  }
  fit();
  window.addEventListener("resize", fit);

  let drawing = false, last = null;
  const ctx = () => canvas.getContext("2d");
  function pos(e){
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }
  function start(e){ drawing = true; last = pos(e); e.preventDefault(); }
  function move(e){
    if (!drawing) return;
    const p = pos(e);
    const pen = canvas.parentElement.parentElement.querySelector(".pen");
    const c = ctx();
    c.strokeStyle = pen ? pen.value : "#e91e63";
    c.lineWidth = 2.5;
    c.lineCap = "round";
    c.beginPath();
    c.moveTo(last.x, last.y);
    c.lineTo(p.x, p.y);
    c.stroke();
    last = p;
    e.preventDefault();
  }
  function end(){ drawing = false; }
  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  window.addEventListener("mouseup", end);
  canvas.addEventListener("touchstart", start, {passive:false});
  canvas.addEventListener("touchmove", move, {passive:false});
  canvas.addEventListener("touchend", end);
}

async function loadComments(certNo, box){
  box.innerHTML = "加载评论…";
  try {
    const data = await api("/teachers/comments?cert_no=" + encodeURIComponent(certNo));
    const items = data.items || [];
    if (!items.length) { box.innerHTML = "<div class='sub'>还没有评论</div>"; return; }
    box.innerHTML = items.map(c =>
      '<div class="comment"><span class="who">' + esc(c.username||"用户") + '</span>' +
      '<span class="when">' + esc(c.created_at||"") + '</span><div>' + esc(c.content) + '</div></div>'
    ).join("");
  } catch (e) {
    box.innerHTML = "<div class='sub'>评论加载失败</div>";
  }
}

async function refreshDanmakuPool(){
  try {
    const data = await api("/teachers/danmaku");
    danmakuPool = (data.items || []).map(function(x){
      return (x.username ? (x.username + "：") : "") + (x.content || "");
    }).filter(Boolean);
  } catch (e) {
    danmakuPool = danmakuPool || [];
  }
}

function spawnDanmaku(){
  if (!danmakuPool.length) return;
  const text = danmakuPool[Math.floor(Math.random() * danmakuPool.length)];
  const layer = document.getElementById("danmakuLayer");
  if (!layer) return;
  const el = document.createElement("div");
  el.className = "danmaku";
  el.textContent = text;
  const size = 14 + Math.floor(Math.random() * 18);
  const top = 8 + Math.random() * 70;
  const dur = 8 + Math.random() * 8;
  el.style.fontSize = size + "px";
  el.style.top = top + "vh";
  el.style.left = "100vw";
  el.style.animationDuration = dur + "s";
  layer.appendChild(el);
  setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, dur * 1000 + 200);
}

document.getElementById("btnSearch").onclick = () => {
  const v = document.getElementById("q").value.trim();
  if (!v) loadList();
  else loadList(v);
};
document.getElementById("q").onkeydown = e => { if (e.key === "Enter") document.getElementById("btnSearch").click(); };

loadList();
refreshDanmakuPool();
setInterval(spawnDanmaku, 1000);
setInterval(refreshDanmakuPool, 30000);
</script>
</body>
</html>
