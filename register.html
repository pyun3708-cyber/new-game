<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>注册学生账号 · 反媚黑高校</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;font-family:"PingFang SC","Microsoft YaHei",sans-serif;
      background:#f7f3ec;color:#292824;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{width:100%;max-width:400px;background:#fff;border-radius:16px;padding:28px 22px;
      box-shadow:0 12px 40px rgba(50,40,30,.08);border:1px solid rgba(41,40,36,.08)}
    h1{font-size:1.25rem;text-align:center;margin-bottom:6px;letter-spacing:.08em}
    .sub{text-align:center;font-size:13px;color:#777;margin-bottom:22px}
    label{display:block;font-size:13px;margin:12px 0 6px;color:#555}
    input{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid #e0d8ce;
      font-size:15px;font-family:inherit;outline:none}
    input:focus{border-color:#8b765d}
    .btn{width:100%;margin-top:18px;padding:13px;border:none;border-radius:10px;
      background:linear-gradient(135deg,#a08060,#8b765d);color:#fff;font-size:15px;
      font-weight:600;cursor:pointer;font-family:inherit}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    .err{color:#c62828;font-size:13px;margin-top:10px;min-height:1.2em}
    .links{text-align:center;margin-top:16px;font-size:13px}
    .links a{color:#8b765d;text-decoration:none}
    .links a:hover{text-decoration:underline}
    .hint{font-size:12px;color:#999;margin-top:12px;line-height:1.5}
  </style>
</head>
<body>
  <div class="card">
    <h1>注册学生账号</h1>
    <p class="sub">仅需用户名、邮箱与密码 · 不做他用</p>
    <label>用户名</label>
    <input id="username" maxlength="20" placeholder="2～20 位，中英文数字下划线" autocomplete="username">
    <label>邮箱</label>
    <input id="email" type="email" placeholder="用于登录（也可用用户名登录）" autocomplete="email">
    <label>密码</label>
    <input id="password" type="password" maxlength="64" placeholder="至少 8 位" autocomplete="new-password">
    <label>确认密码</label>
    <input id="password2" type="password" maxlength="64" placeholder="再输入一次" autocomplete="new-password">
    <div class="err" id="err"></div>
    <button class="btn" id="btn" type="button">注册</button>
    <p class="links"><a href="login.html">已有账号？去登录</a> · <a href="school.html">返回官网</a></p>
    <p class="hint">密码经哈希后存于自有 Cloudflare 数据库。本站不主动收集身份证等多余隐私。</p>
  </div>
<script>
const API_BASE = "https://school-auth.pyun3708.workers.dev";

document.getElementById("btn").onclick = async () => {
  const err = document.getElementById("err");
  const btn = document.getElementById("btn");
  err.textContent = "";
  const username = document.getElementById("username").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const password2 = document.getElementById("password2").value;
  if (password !== password2) { err.textContent = "两次密码不一致"; return; }
  btn.disabled = true;
  try {
    const res = await fetch(API_BASE + "/auth/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, email, password, turnstileToken: "" }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || ("注册失败 " + res.status));
    localStorage.setItem("school_token", data.token);
    localStorage.setItem("school_user", JSON.stringify(data.user));
    location.href = "school.html";
  } catch (e) {
    err.textContent = e.message || "网络错误";
  } finally {
    btn.disabled = false;
  }
};
</script>
</body>
</html>
