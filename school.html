<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f3ec">
  <title>反媚黑高校 · 成人官网</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap');
    :root {
      --paper:#f7f3ec; --ink:#292824; --muted:#777268;
      --line:rgba(41,40,36,.15); --accent:#8b765d; --card:rgba(255,255,255,.55);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;color:var(--ink);
      background:radial-gradient(circle at 10% 10%,rgba(139,118,93,.08),transparent 28%),
        radial-gradient(circle at 90% 80%,rgba(139,118,93,.07),transparent 30%),var(--paper);
      font-family:"Noto Serif SC","Songti SC",serif;letter-spacing:.04em;
    }
    a{color:inherit;text-decoration:none}
    .back-bar{width:min(1180px,92%);margin:16px auto 0}
    .back-bar a{color:var(--accent);font-size:13px;letter-spacing:.12em}
    .hero{width:min(1180px,92%);margin:0 auto;padding:48px 0 28px;text-align:center}
    .eyebrow{color:var(--muted);font-family:Arial,sans-serif;font-size:11px;letter-spacing:.32em;text-transform:uppercase;margin-bottom:14px}
    .title-row{
      display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;
    }
    .school-badge{
      width:clamp(64px,12vw,96px);height:clamp(64px,12vw,96px);
      object-fit:contain;border-radius:50%;
      box-shadow:0 6px 20px rgba(0,0,0,.18);
      background:#1a1a1a;flex-shrink:0;
    }
    .school-title{font-size:clamp(36px,7vw,72px);font-weight:500;letter-spacing:.18em;line-height:1.15;cursor:pointer;user-select:none}
    .school-title .fan{position:relative;display:inline-block;transition:color .25s}
    .school-title .fan::after{content:"";position:absolute;left:-4%;right:-4%;top:52%;height:3px;background:#c62828;transform:scaleX(0);transform-origin:center;transition:transform .28s ease;border-radius:2px}
    .school-title:hover .fan::after,.school-title.struck .fan::after{transform:scaleX(1)}
    .school-title:hover .fan,.school-title.struck .fan{color:#8b3a3a}
    .title-line{width:52px;height:1px;background:var(--accent);margin:28px auto 0}

    .carousel{position:relative;width:min(1100px,96%);margin:8px auto 20px;height:min(56vw,440px);min-height:260px;user-select:none}
    .carousel-stage{position:relative;width:100%;height:100%}
    .slide{
      position:absolute;top:50%;left:50%;
      width:min(52%,420px);height:88%;
      transform:translate(-50%,-50%) scale(.72);opacity:0;
      transition:transform .55s cubic-bezier(.4,.1,.2,1),opacity .55s ease;
      border-radius:6px;overflow:hidden;background:#12100e;
      box-shadow:0 12px 36px rgba(0,0,0,.28);pointer-events:none;
    }
    .slide.is-active{transform:translate(-50%,-50%) scale(1);opacity:1;z-index:5;pointer-events:auto;box-shadow:0 18px 48px rgba(0,0,0,.35)}
    .slide.is-prev{transform:translate(calc(-50% - 58%),-50%) scale(.72);opacity:.75;z-index:3;pointer-events:auto;cursor:pointer}
    .slide.is-next{transform:translate(calc(-50% + 58%),-50%) scale(.72);opacity:.75;z-index:3;pointer-events:auto;cursor:pointer}
    .slide.is-far-prev{transform:translate(calc(-50% - 100%),-50%) scale(.55);opacity:0;z-index:1}
    .slide.is-far-next{transform:translate(calc(-50% + 100%),-50%) scale(.55);opacity:0;z-index:1}
    .slide img,.slide .swap{width:100%;height:100%;display:block}
    .slide>img{object-fit:contain;object-position:center;background:#0d0d0d}
    .swap{position:relative;cursor:pointer}
    .swap img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;background:#0d0d0d;transition:opacity .35s;pointer-events:none}
    .swap .img-b{opacity:0}
    .swap:hover .img-a{opacity:0}
    .swap:hover .img-b{opacity:1}
    .swap.on .img-a{opacity:0}
    .swap.on .img-b{opacity:1}

    .nav-btn{
      position:absolute;top:50%;transform:translateY(-50%);z-index:10;
      width:44px;height:44px;border:none;border-radius:50%;
      background:rgba(255,255,255,.85);color:#3a322c;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 6px 18px rgba(0,0,0,.15);transition:background .2s,transform .2s;
    }
    .nav-btn:hover{background:#fff;transform:translateY(-50%) scale(1.06)}
    .nav-btn svg{width:18px;height:18px;fill:currentColor}
    .nav-prev{left:6px}.nav-next{right:6px}

    .dots{display:flex;justify-content:center;gap:8px;margin:0 0 36px}
    .dots button{width:8px;height:8px;border-radius:50%;border:none;background:rgba(41,40,36,.22);cursor:pointer;padding:0}
    .dots button.active{background:var(--accent);transform:scale(1.25)}
    .gallery-hint{text-align:center;font-size:12px;color:var(--muted);letter-spacing:.1em;margin:-20px 0 48px}

    .intro{width:min(760px,88%);margin:0 auto 82px;text-align:center}
    .section-label{font-family:Arial,sans-serif;font-size:10px;color:var(--accent);letter-spacing:.3em;margin-bottom:20px}
    .intro p{color:#514e47;font-size:16px;line-height:2.25}
    .spoiler{background:#292824;color:transparent;border-radius:3px;cursor:help;transition:color .2s,background .2s;padding:0 .12em}
    .spoiler:hover,.spoiler:active,.spoiler.on{background:rgba(139,118,93,.15);color:inherit}

    .services{width:min(1080px,90%);margin:0 auto 90px}
    .services-header{text-align:center;margin-bottom:34px}
    .services-header h2{font-size:26px;font-weight:500;letter-spacing:.14em}
    .service-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    .service-card{position:relative;min-height:126px;display:flex;align-items:flex-end;padding:25px;border:1px solid var(--line);background:var(--card);transition:transform .25s,background .25s,box-shadow .25s}
    .service-card::before{content:"";position:absolute;width:42px;height:1px;top:25px;left:25px;background:var(--accent);transition:width .25s}
    .service-card:hover{transform:translateY(-4px);background:rgba(255,255,255,.88);box-shadow:0 14px 35px rgba(50,45,38,.09)}
    .service-card:hover::before{width:70px}
    .service-name{font-size:17px;letter-spacing:.08em}
    .service-number{position:absolute;right:22px;top:20px;color:rgba(41,40,36,.22);font:12px Arial,sans-serif}

    footer{border-top:1px solid var(--line);width:min(1180px,92%);margin:0 auto;padding:30px 0 42px;display:flex;justify-content:space-between;color:var(--muted);font-size:11px;letter-spacing:.12em}

    @media(max-width:700px){
      .carousel{height:62vw;min-height:220px}
      .slide{width:min(70%,280px)}
      .slide.is-prev{transform:translate(calc(-50% - 42%),-50%) scale(.68)}
      .slide.is-next{transform:translate(calc(-50% + 42%),-50%) scale(.68)}
      .nav-btn{width:36px;height:36px}
      .title-row{gap:10px}
      .service-grid{grid-template-columns:repeat(2,1fr)}
      footer{display:block;line-height:2}
    }
  </style>
</head>
<body>
  <div class="back-bar"><a href="index.html">← 返回草莓酱主页</a></div>

  <header class="hero">
    <div class="eyebrow">ANTI-BLACKED RESISTANCE ACADEMY</div>
    <div class="title-row">
      <img class="school-badge" src="school-badge.png" alt="反媚黑高校校徽">
      <h1 class="school-title" id="schoolTitle"><span class="fan">反</span>媚黑高校</h1>
    </div>
    <div class="title-line"></div>
  </header>

  <div class="carousel" id="carousel">
    <button class="nav-btn nav-prev" id="btnPrev" aria-label="上一张">
      <svg viewBox="0 0 24 24"><path d="M15.4 4.6L13.9 3.1 5 12l8.9 8.9 1.5-1.5L8 12z"/></svg>
    </button>
    <button class="nav-btn nav-next" id="btnNext" aria-label="下一张">
      <svg viewBox="0 0 24 24"><path d="M8.6 4.6L10.1 3.1 19 12l-8.9 8.9-1.5-1.5L16 12z"/></svg>
    </button>
    <div class="carousel-stage">
      <div class="slide">
        <div class="swap" data-swap>
          <img class="img-a" src="莉音1.png" alt="莉音">
          <img class="img-b" src="莉音2.png" alt="莉音">
        </div>
      </div>
      <div class="slide">
        <div class="swap" data-swap>
          <img class="img-a" src="知更鸟1.jpg" alt="知更鸟">
          <img class="img-b" src="知更鸟2.jpg" alt="知更鸟">
        </div>
      </div>
      <div class="slide"><img src="三月七.jpg" alt="三月七"></div>
      <div class="slide"><img src="多人1.png" alt="学员展示"></div>
      <div class="slide"><img src="无标题167_20260911001307.png" alt="训练现场"></div>
    </div>
  </div>
  <div class="dots" id="dots"></div>
  <p class="gallery-hint">中间大图 · 两侧预览 · 自动从右往左 · 箭头可切换</p>

  <section class="intro">
    <div class="section-label">ABOUT OUR SCHOOL</div>
    <p>
      本校对外宣称培养对黑色诱惑的
      <span class="spoiler">抵抗力</span>，
      对内则进行系统化
      <span class="spoiler">媚黑洗脑与服从训练</span>。
      课程涵盖视觉脱敏、高潮管理与实践考核。
      校训：
      <span class="spoiler">先学会跪，再谈毕业。</span>
    </p>
  </section>

  <main class="services">
    <div class="services-header">
      <div class="section-label">CAMPUS SERVICES</div>
      <h2>校园服务</h2>
    </div>
    <div class="service-grid">
      <a class="service-card" href="admission.html"><span class="service-number">01</span><span class="service-name">办理入学</span></a>
      <a class="service-card" href="teacher-job.html"><span class="service-number">02</span><span class="service-name">教师求职</span></a>
      <a class="service-card" href="teachers.html"><span class="service-number">03</span><span class="service-name">老师介绍</span></a>
      <a class="service-card" href="courses.html"><span class="service-number">04</span><span class="service-name">课程学习</span></a>
      <a class="service-card" href="exam.html"><span class="service-number">05</span><span class="service-name">在线考试</span></a>
      <a class="service-card" href="exam.html"><span class="service-number">06</span><span class="service-name">每周小测</span></a>
      <a class="service-card" href="message-wall.html"><span class="service-number">07</span><span class="service-name">学校留言墙</span></a>
      <a class="service-card" href="support.html"><span class="service-number">08</span><span class="service-name">资助校方</span></a>
      <a class="service-card" href="hidden-corner.html"><span class="service-number">09</span><span class="service-name">隐蔽角落</span></a>
    </div>
  </main>

  <footer>
    <span>反媚黑高校 · OFFICIAL WEBSITE</span>
    <span>© 2026 反媚黑高校</span>
  </footer>

  <script>
  (function(){
    var slides=[].slice.call(document.querySelectorAll('.slide'));
    var n=slides.length, index=0, timer=null, INTERVAL=4000;
    var dotsBox=document.getElementById('dots');
    for(var d=0;d<n;d++){
      var b=document.createElement('button'); b.type='button';
      (function(i){ b.onclick=function(){ goTo(i); restart(); }; })(d);
      dotsBox.appendChild(b);
    }
    var dots=[].slice.call(dotsBox.querySelectorAll('button'));

    function posClass(offset){
      if(offset===0) return 'is-active';
      if(offset===-1||offset===n-1) return 'is-prev';
      if(offset===1||offset===1-n) return 'is-next';
      return offset<0 ? 'is-far-prev' : 'is-far-next';
    }
    function render(){
      slides.forEach(function(el,i){
        var offset=i-index;
        if(offset>n/2) offset-=n;
        if(offset<-n/2) offset+=n;
        el.className='slide '+posClass(offset);
      });
      dots.forEach(function(dot,i){ dot.classList.toggle('active', i===index); });
    }
    function goTo(i){ index=((i%n)+n)%n; render(); }
    function next(){ goTo(index+1); }
    function prev(){ goTo(index-1); }
    function restart(){ clearInterval(timer); timer=setInterval(next, INTERVAL); }

    document.getElementById('btnNext').onclick=function(){ next(); restart(); };
    document.getElementById('btnPrev').onclick=function(){ prev(); restart(); };
    slides.forEach(function(el){
      el.onclick=function(){
        if(el.classList.contains('is-prev')){ prev(); restart(); }
        else if(el.classList.contains('is-next')){ next(); restart(); }
      };
    });
    var car=document.getElementById('carousel');
    car.onmouseenter=function(){ clearInterval(timer); };
    car.onmouseleave=function(){ restart(); };
    var startX=0;
    car.addEventListener('touchstart',function(e){ startX=e.changedTouches[0].clientX; clearInterval(timer); },{passive:true});
    car.addEventListener('touchend',function(e){
      var dx=e.changedTouches[0].clientX-startX;
      if(Math.abs(dx)>40){ if(dx<0) next(); else prev(); }
      restart();
    },{passive:true});
    render(); restart();
  })();

  document.getElementById('schoolTitle').onclick=function(){ this.classList.toggle('struck'); };
  document.querySelectorAll('[data-swap]').forEach(function(el){
    el.addEventListener('click',function(e){
      var slide=el.closest('.slide');
      if(!slide||!slide.classList.contains('is-active')) return;
      if(window.matchMedia('(hover:hover) and (pointer:fine)').matches) return;
      e.stopPropagation(); el.classList.toggle('on');
    });
  });
  document.querySelectorAll('.spoiler').forEach(function(el){
    el.onclick=function(e){ e.preventDefault(); el.classList.toggle('on'); };
  });
  </script>
</body>
</html>
