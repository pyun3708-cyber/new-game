<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>隐蔽角落 · 反媚黑高校</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #e8e0f0;
      background: linear-gradient(180deg, #1a1028 0%, #0d0814 100%);
    }
    .card {
      width: 100%;
      max-width: 360px;
      padding: 28px 24px;
      border-radius: 16px;
      background: rgba(40, 28, 56, 0.92);
      border: 1px solid rgba(180, 140, 220, 0.25);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    h1 {
      font-size: 1.15rem;
      letter-spacing: 0.2em;
      margin-bottom: 8px;
      color: #e8d5ff;
    }
    .sub {
      font-size: 13px;
      color: #9a8ab0;
      margin: 16px 0 8px;
      line-height: 1.7;
    }
    .badge {
      display: inline-block;
      margin-top: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      color: #f0c0c8;
      background: rgba(160, 60, 80, 0.35);
      border: 1px solid rgba(240, 128, 144, 0.35);
      letter-spacing: 0.08em;
    }
    .back {
      display: inline-block;
      margin-top: 22px;
      font-size: 13px;
      color: #9a8ab0;
      text-decoration: none;
    }
    .back:hover { color: #e8d5ff; }
  </style>
</head>
<body>
  <div class="card">
    <h1>隐蔽角落</h1>
    <span class="badge">已封闭</span>
    <p class="sub">此区域已关闭，暂不开放。<br>穷举密码也进不去哦。</p>
    <a class="back" href="school.html">← 返回学校官网</a>
  </div>
  <script>
    // 清除旧会话里的通行标记，防止之前猜对的人还能直接进
    try { sessionStorage.removeItem("hiddenCornerOk"); } catch (e) {}
  </script>
</body>
</html>
