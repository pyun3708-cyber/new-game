<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>反媚黑洗脑成人高校教师资格证考试♠️</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#020304;color:#d8dde0;font-family:"Courier New","Microsoft YaHei",monospace;overflow:hidden}
</style>
</head>
<body>
<script>
// TEMP bootstrap: pull full exam from historical commit then strip lock
(async function(){
  try{
    const urls=[
      'https://cdn.jsdelivr.net/gh/pyun3708-cyber/new-game@fc279876/teacher-exam-male.html',
      'https://raw.githubusercontent.com/pyun3708-cyber/new-game/fc279876/teacher-exam-male.html'
    ];
    let html=null;
    for (const u of urls){
      try{
        const r=await fetch(u,{cache:'no-store'});
        if(r.ok){html=await r.text(); if(html&&html.length>10000) break;}
      }catch(e){}
    }
    if(!html){document.body.innerHTML='<p style="color:#fff;padding:20px">考试加载失败，请从学校官网-教师招聘-诚信宣誓进入，或稍后重试。</p>';return;}
    // strip password lock block
    html=html.replace(/<div id="examLock"[\s\S]*?<\/div>\s*<\/div>\s*<\/div>/,'');
    html=html.replace(/<script>\s*\(function\(\)\{[\s\S]*?5200[\s\S]*?\}\)\(\);\s*<\/script>/,'');
    document.open();
    document.write(html);
    document.close();
    try{sessionStorage.setItem('teacherExamUnlocked','1');}catch(e){}
    setTimeout(function(){
      var el=document.getElementById('examLock');
      if(el) el.remove();
    },50);
  }catch(err){
    document.body.innerHTML='<p style="color:#fff;padding:20px">'+String(err)+'</p>';
  }
})();
</script>
</body>
</html>
