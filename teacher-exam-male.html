<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>反媚黑洗脑成人高校教师资格证考试♠️</title>
<style>
html,body{width:100%;height:100%;margin:0;background:#020304;color:#d8dde0;font-family:Microsoft YaHei,sans-serif}
.boot{display:flex;align-items:center;justify-content:center;height:100%;letter-spacing:.12em;font-size:14px;color:#889}
</style>
</head>
<body>
<div class="boot" id="boot">正在载入考试模块…</div>
<script>
(async function () {
  var boot = document.getElementById("boot");
  function fail(msg) {
    if (boot) boot.textContent = msg;
    else document.body.innerHTML = '<p style="color:#fff;padding:20px">' + msg + "</p>";
  }
  try {
    var urls = [
      "https://cdn.jsdelivr.net/gh/pyun3708-cyber/new-game@fc279876/teacher-exam-male.html",
      "https://raw.githubusercontent.com/pyun3708-cyber/new-game/fc279876/teacher-exam-male.html",
    ];
    var html = null;
    for (var i = 0; i < urls.length; i++) {
      try {
        var r = await fetch(urls[i], { cache: "no-store" });
        if (r.ok) {
          var t = await r.text();
          if (t && t.length > 10000) { html = t; break; }
        }
      } catch (e) {}
    }
    if (!html) { fail("考试加载失败，请稍后重试"); return; }

    html = html.replace(/<div id="examLock"[\s\S]*?<\/div>\s*<\/div>\s*<\/div>/, "");
    html = html.replace(/<script>\s*\(function\(\)\{\s*var unlocked[\s\S]*?5200[\s\S]*?\}\)\(\);\s*<\/script>/, "");

    var injectCss =
      "<style id=\"mobile-result-fix\">" +
      "html,body{overflow:auto!important;height:auto!important;min-height:100%!important}" +
      "#resultScreen{align-items:flex-start!important;justify-content:center!important;" +
      "overflow-y:auto!important;-webkit-overflow-scrolling:touch!important;padding:12px 12px 40px!important}" +
      "#resultScreen .panel{width:min(720px,100%)!important;margin:8px auto 24px!important;max-width:100%!important}" +
      "#radarCanvas{width:min(92vw,420px)!important;height:auto!important;aspect-ratio:1!important;max-width:96vw!important;display:block!important;margin:0 auto!important}" +
      "#resultExtra{max-width:100%!important;text-align:left!important}" +
      "#quickTestBtn{position:fixed;right:12px;bottom:12px;z-index:9998;padding:8px 12px;border:1px solid #4c565b;background:rgba(10,13,15,.88);color:#9aa;border-radius:8px;font:12px Microsoft YaHei,sans-serif;cursor:pointer}" +
      "</style>";
    if (html.indexOf("</head>") >= 0) html = html.replace("</head>", injectCss + "</head>");
    else html = injectCss + html;

    if (html.indexOf('id="resultExtra"') < 0) {
      html = html.replace(
        /(<div style="margin-top:16px"><button class="ctrl" onclick="location\.reload\(\)">重新开始<\/button><\/div>\s*<\/div>\s*<\/div>)/,
        '<div id="resultExtra" style="max-width:100%;margin:12px auto 0;color:#c8ced1;font:14px/1.7 Microsoft YaHei,sans-serif;text-align:left"></div>$1'
      );
    }

    var hook =
      "<script>(function(){\n" +
      "function patchRadar(){\n" +
      "  if(typeof window.showRadar!=='function'||window.showRadar._mobilePatched)return;\n" +
      "  var orig=window.showRadar;\n" +
      "  window.showRadar=function(){\n" +
      "    try{document.documentElement.style.overflow='auto';document.body.style.overflow='auto';document.body.style.height='auto';}catch(e){}\n" +
      "    var r=orig.apply(this,arguments);\n" +
      "    try{if(typeof buildResultExtra==='function')buildResultExtra();}catch(e2){}\n" +
      "    return r;\n" +
      "  };\n" +
      "  window.showRadar._mobilePatched=true;\n" +
      "}\n" +
      "function fillAllScores(){\n" +
      "  try{\n" +
      "    if(typeof ATTRS!=='undefined'&&ATTRS&&typeof totalScore!=='undefined'){\n" +
      "      ATTRS.forEach(function(a){totalScore[a]=100;});\n" +
      "    }\n" +
      "  }catch(e){}\n" +
      "}\n" +
      "function openQuickTestGate(){\n" +
      "  var p=prompt('请输入快速测试密码');\n" +
      "  if(p===null)return;\n" +
      "  if(String(p).trim()!=='5200'){alert('密码错误');return;}\n" +
      "  window.__quickTestMode=true;\n" +
      "  if(typeof window.__quickTestToResult==='function'){\n" +
      "    window.__quickTestToResult();\n" +
      "    return;\n" +
      "  }\n" +
      "  fillAllScores();\n" +
      "  try{\n" +
      "    var info={name:'测试考生',gender:'男',age:'22'};\n" +
      "    try{var old=JSON.parse(sessionStorage.getItem('teacherExamInfo')||'{}')||{};\n" +
      "      if(old.name)info.name=old.name;if(old.gender)info.gender=old.gender;if(old.age)info.age=old.age;\n" +
      "    }catch(e0){}\n" +
      "    sessionStorage.setItem('teacherExamInfo',JSON.stringify(info));\n" +
      "    try{candidateName=info.name;}catch(e1){}\n" +
      "  }catch(e){}\n" +
      "  ['bootScreen','startScreen','quizScreen','interviewScreen','matchScreen','transition'].forEach(function(id){\n" +
      "    var el=document.getElementById(id);if(el)el.style.display='none';\n" +
      "  });\n" +
      "  if(typeof showRadar==='function')showRadar();\n" +
      "  try{if(typeof buildResultExtra==='function')buildResultExtra();}catch(e3){}\n" +
      "  setTimeout(function(){\n" +
      "    try{if(typeof buildResultExtra==='function')buildResultExtra();}catch(e4){}\n" +
      "    var box=document.getElementById('resultExtra');\n" +
      "    if(box)box.scrollIntoView({behavior:'smooth',block:'start'});\n" +
      "  },300);\n" +
      "}\n" +
      "window.openQuickTestGate=openQuickTestGate;\n" +
      "function injectQuickBtn(){\n" +
      "  if(document.getElementById('quickTestBtn'))return;\n" +
      "  var b=document.createElement('button');\n" +
      "  b.id='quickTestBtn';b.type='button';b.textContent='快速测试通道';\n" +
      "  b.onclick=openQuickTestGate;\n" +
      "  document.body.appendChild(b);\n" +
      "}\n" +
      "patchRadar();injectQuickBtn();\n" +
      "setTimeout(patchRadar,300);setTimeout(patchRadar,1500);\n" +
      "setTimeout(injectQuickBtn,500);setTimeout(injectQuickBtn,2000);\n" +
      "try{sessionStorage.setItem('teacherExamUnlocked','1');}catch(e){}\n" +
      "var el=document.getElementById('examLock');if(el)el.remove();\n" +
      "})();<\/script>";

    if (html.indexOf("teacher-exam-extras.js") < 0) {
      html = html.replace("</body>", '<script src="teacher-exam-extras.js"><\/script></body>');
    }
    html = html.replace("</body>", hook + "</body>");

    document.open();
    document.write(html);
    document.close();
  } catch (err) {
    fail(String(err && err.message ? err.message : err));
  }
})();
</script>
</body>
</html>
