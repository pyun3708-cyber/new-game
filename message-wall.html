<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>反媚黑高校 · 学校留言墙</title>
  <style>
    :root {
      --ink: #2a2420; --muted: #7a6e64; --accent: #8b765d;
      --card: rgba(255, 250, 244, 0.88); --pink: #c45c7a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink); line-height: 1.55; background: #1a1512;
    }
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse at center, rgba(20,16,14,.35) 0%, rgba(10,8,7,.78) 70%, rgba(8,6,5,.92) 100%),
        #120e0c url("school-badge.png") center center / min(72vmin, 520px) no-repeat;
    }
    .bg::after {
      content: ""; position: absolute; inset: 0;
      background: rgba(18, 14, 12, 0.42); pointer-events: none;
    }
    .wrap {
      position: relative; z-index: 1; max-width: 640px;
      margin: 0 auto; padding: 16px 14px 48px; min-height: 100vh;
    }
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 18px; gap: 10px; flex-wrap: wrap;
    }
    .top-bar a { color: #e8d5c4; text-decoration: none; font-size: 13px; }
    .sync { font-size: 11px; color: #c4b0a0; }
    .sync.ok { color: #9ccc65; }
    .sync.err { color: #ef9a9a; }
    .hero { text-align: center; margin-bottom: 18px; color: #f5ebe0; }
    .hero h1 {
      font-size: 1.45rem; font-weight: 700; letter-spacing: .14em;
      text-shadow: 0 2px 12px rgba(0,0,0,.5);
    }
    .hero p { margin-top: 8px; font-size: 13px; color: #d4c0b0; }
    .panel {
      background: var(--card); border: 1px solid rgba(255,255,255,.35);
      border-radius: 16px; padding: 16px 14px;
      box-shadow: 0 12px 40px rgba(0,0,0,.28);
      backdrop-filter: blur(10px);
    }
    .board-sub { font-size: 12px; color: var(--pink); margin-bottom: 12px; line-height: 1.5; }
    .login-gate {
      text-align: center; padding: 18px 12px; background: rgba(255,255,255,.5);
      border-radius: 12px; margin-bottom: 14px; border: 1px dashed #d0c0b0;
    }
    .login-gate a {
      display: inline-block; margin: 8px 6px 0; padding: 8px 16px;
      background: #8b765d; color: #fff; border-radius: 10px; text-decoration: none; font-size: 14px;
    }
    .msg-form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .msg-form textarea {
      width: 100%; border: 1.5px solid #e0d0c0; border-radius: 12px;
      padding: 10px 12px; font-size: 14px; font-family: inherit; outline: none;
      background: rgba(255,255,255,.85); min-height: 78px; resize: vertical;
    }
    .anon-row {
      display: flex; align-items: center; gap: 8px; font-size: 13px; color: #5a4a40;
    }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      border: none; border-radius: 10px; padding: 10px 16px; font-size: 14px;
      font-weight: 600; cursor: pointer; font-family: inherit;
    }
    .btn-send {
      background: linear-gradient(135deg, #a08060, #8b765d); color: #fff;
      flex: 1; min-width: 120px;
    }
    .btn-cancel-reply { background: #eee6dc; color: #6a5a4a; display: none; }
    .btn-cancel-reply.show { display: inline-block; }
    .btn-like { background: #f5e6dc; color: #8b5a4a; font-size: 12px; padding: 6px 10px; }
    .btn-del { background: #f5d6d6; color: #a33; font-size: 12px; padding: 6px 10px; }
    .btn-reply { background: #e8efe8; color: #4a6a4a; font-size: 12px; padding: 6px 10px; }
    .msg-list { text-align: left; max-height: min(62vh, 560px); overflow-y: auto; }
    .msg {
      background: rgba(255,255,255,.78); border-radius: 12px;
      padding: 10px 12px; margin-bottom: 10px; border: 1px solid #eadcce;
    }
    .msg .meta { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .msg .meta a.nick-link { color: var(--accent); font-weight: 600; text-decoration: none; border-bottom: 1px dashed rgba(139,118,93,.45); }
    .msg .meta .nick-anon { color: var(--muted); font-weight: 600; cursor: default; }
    .msg .body { font-size: 14px; color: #3a322c; white-space: pre-wrap; word-break: break-word; }
    .msg .actions { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
    .msg.reply { margin-left: 14px; border-left: 3px solid #c4a888; }
    .hint { font-size: 13px; color: var(--muted); text-align: center; padding: 20px 10px; }
    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(16px);
      background: rgba(40, 28, 20, .92); color: #fff; padding: 10px 18px;
      border-radius: 999px; font-size: 13px; opacity: 0; pointer-events: none;
      transition: opacity .2s, transform .2s; z-index: 60;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="wrap">
    <div class="top-bar">
      <a href="school.html">← 返回学校官网</a>
      <span class="sync" id="sync">连接中…</span>
    </div>
    <div class="hero">
      <h1>学校留言墙</h1>
      <p>需登录后发言 · 可选匿名显示</p>
    </div>
    <div class="panel">
      <p class="board-sub">必须登录才能发送。勾选「匿名发言」后公开展示为「匿名」，且无法点进主页。非匿名名字可点击查看对方主页。禁止发图。</p>
      <div id="gate" class="login-gate" style="display:none">
        <div>登录后才能发言</div>
        <a href="login.html">去登录</a>
        <a href="register.html" style="background:#6a5a4a">注册账号</a>
      </div>
      <div id="composer" style="display:none">
        <div class="msg-form">
          <div class="anon-row">
            <input type="checkbox" id="anonymous">
            <label for="anonymous">匿名发言（别人只看到「匿名」，不可点进主页）</label>
          </div>
          <textarea id="msg" maxlength="500" placeholder="写留言…（禁止发图，最多500字）"></textarea>
          <div class="btn-row">
            <button type="button" class="btn-send" id="btnSend">发送留言</button>
            <button type="button" class="btn-cancel-reply" id="cancelReply">取消回复</button>
          </div>
        </div>
      </div>
      <div class="msg-list" id="list"><div class="hint">正在加载留言…</div></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
<script>
const API_BASE = "https://school-auth.pyun3708.workers.dev";
function token() {
  try { return localStorage.getItem("school_token") || ""; }
  catch (e) { return ""; }
}
function user() {
  try { return JSON.parse(localStorage.getItem("school_user") || "null"); }
  catch (e) { return null; }
}
let messages = [];
let replyToId = null;
let me = user();
function toast(m) {
  const el = document.getElementById("toast");
  if (!el) return;
  el.textContent = m;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { el.classList.remove("show"); }, 2200);
}
function esc(s) {
  var amp = "&" + "amp;";
  var lt = "&" + "lt;";
  var gt = "&" + "gt;";
  var quot = "&" + "quot;";
  var apos = "&#" + "39;";
  return String(s == null ? "" : s)
    .replace(/&/g, amp)
    .replace(/</g, lt)
    .replace(/>/g, gt)
    .replace(/"/g, quot)
    .replace(/'/g, apos);
}
function fmtTime(ts) {
  if (ts == null || ts === "") return "";
  var d = new Date(typeof ts === "number" ? ts : ts);
  if (isNaN(d.getTime())) return String(ts);
  function p(n) { return String(n).padStart(2, "0"); }
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " +
    p(d.getHours()) + ":" + p(d.getMinutes());
}
function refreshGate() {
  me = user();
  var logged = !!(token() && me);
  var gate = document.getElementById("gate");
  var composer = document.getElementById("composer");
  if (gate) gate.style.display = logged ? "none" : "block";
  if (composer) composer.style.display = logged ? "block" : "none";
}
function normalizeMsg(m) {
  if (!m || typeof m !== "object") return null;
  var anon = m.anonymous === 1 || m.anonymous === true || m.is_anonymous === 1 || m.is_anonymous === true;
  var uname = m.username || "";
  var nick = anon ? "匿名" : (m.nick_display || uname || "用户");
  return {
    id: m.id,
    user_id: m.user_id,
    username: uname,
    nick_display: nick,
    is_anonymous: anon ? 1 : 0,
    anonymous: anon ? 1 : 0,
    text: m.text || m.content || "",
    content: m.content || m.text || "",
    reply_to: m.reply_to || m.replyTo || null,
    created_at: m.created_at,
    likes: Number(m.likes || m.like_count || 0),
    like_count: Number(m.like_count || m.likes || 0),
    liked_by_me: !!m.liked_by_me
  };
}
function api(path, opts) {
  opts = opts || {};
  var headers = { "Content-Type": "application/json" };
  if (opts.headers) { for (var k in opts.headers) headers[k] = opts.headers[k]; }
  if (token()) headers.Authorization = "Bearer " + token();
  var ctrl = new AbortController();
  var timer = setTimeout(function () { ctrl.abort(); }, 12000);
  return fetch(API_BASE + path, {
    method: opts.method || "GET",
    headers: headers,
    body: opts.body,
    signal: ctrl.signal
  }).then(function (res) {
    return res.json().catch(function () { return {}; }).then(function (data) {
      if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
      return data;
    });
  }).finally(function () { clearTimeout(timer); });
}
function render() {
  var box = document.getElementById("list");
  if (!box) return;
  if (!messages.length) {
    box.innerHTML = '<div class="hint">还没有留言，来当第一个吧～</div>';
    return;
  }
  var byId = {};
  messages.forEach(function (m) { if (m && m.id) byId[m.id] = m; });
  var roots = messages.filter(function (m) {
    return m && m.id && (!m.reply_to || !byId[m.reply_to]);
  }).sort(function (a, b) { return Number(b.created_at || 0) - Number(a.created_at || 0); });
  var children = {};
  messages.forEach(function (m) {
    if (m && m.reply_to && byId[m.reply_to]) {
      if (!children[m.reply_to]) children[m.reply_to] = [];
      children[m.reply_to].push(m);
    }
  });
  Object.keys(children).forEach(function (k) {
    children[k].sort(function (a, b) { return Number(a.created_at || 0) - Number(b.created_at || 0); });
  });
  var myId = me && (me.id || me.user_id);
  function card(m, isReply) {
    var likes = m.like_count || m.likes || 0;
    var liked = !!m.liked_by_me;
    var isOwn = myId && m.user_id === myId;
    var nick = m.nick_display || m.username || "匿名";
    var isAnon = !!m.is_anonymous || nick === "匿名";
    var linkUser = (m.username && m.username !== "匿名" && m.username !== "用户")
      ? m.username
      : ((!isAnon && nick !== "用户") ? nick : "");
    var canLink = !isAnon && !!linkUser;
    var nickHtml = canLink
      ? ('<a class="nick-link" href="profile.html?u=' + encodeURIComponent(linkUser) + '" title="查看主页">' + esc(nick) + "</a>")
      : ('<span class="nick-anon" title="无法查看主页">' + esc(nick) + "</span>");
    var replyHtml = "";
    if (m.reply_to && byId[m.reply_to]) {
      var rn = byId[m.reply_to].nick_display || "匿名";
      var ra = !!byId[m.reply_to].is_anonymous || rn === "匿名";
      var rUser = (byId[m.reply_to].username && byId[m.reply_to].username !== "匿名" && byId[m.reply_to].username !== "用户")
        ? byId[m.reply_to].username : "";
      replyHtml = (ra || !rUser)
        ? (" · 回复 <span class=\"nick-anon\">" + esc(rn) + "</span>")
        : (" · 回复 <a class=\"nick-link\" href=\"profile.html?u=" + encodeURIComponent(rUser) + "\">" + esc(rn) + "</a>");
    }
    var body = m.text || m.content || "";
    return (
      '<div class="msg' + (isReply ? " reply" : "") + '" data-id="' + esc(m.id) + '">' +
        '<div class="meta">' + nickHtml + " · " + fmtTime(m.created_at) + replyHtml + "</div>" +
        '<div class="body">' + esc(body) + "</div>" +
        '<div class="actions">' +
          '<button type="button" class="btn-like" data-act="like">' + (liked ? "已赞 " : "点赞 ") + likes + "</button>" +
          (token() ? '<button type="button" class="btn-reply" data-act="reply">回复</button>' : "") +
          (isOwn ? '<button type="button" class="btn-del" data-act="del">删除</button>' : "") +
        "</div></div>"
    );
  }
  var html = "";
  roots.forEach(function (m) {
    html += card(m, false);
    (children[m.id] || []).forEach(function (c) { html += card(c, true); });
  });
  box.innerHTML = html || '<div class="hint">还没有留言，来当第一个吧～</div>';
  box.querySelectorAll(".msg").forEach(function (el) {
    var id = el.getAttribute("data-id");
    var m = byId[id];
    if (!m) return;
    var likeBtn = el.querySelector('[data-act="like"]');
    var replyBtn = el.querySelector('[data-act="reply"]');
    var delBtn = el.querySelector('[data-act="del"]');
    if (likeBtn) likeBtn.onclick = function () { like(m.id); };
    if (replyBtn) replyBtn.onclick = function () { setReply(m); };
    if (delBtn) delBtn.onclick = function () { delOwn(m.id); };
  });
}
function pull() {
  var box = document.getElementById("list");
  var sync = document.getElementById("sync");
  return api("/wall/messages").then(function (data) {
    var raw = data.messages || data.items || data.data || [];
    messages = (Array.isArray(raw) ? raw : []).map(normalizeMsg).filter(Boolean);
    if (sync) { sync.textContent = "● 已同步 " + messages.length + " 条"; sync.className = "sync ok"; }
    render();
  }).catch(function (e) {
    console.error("wall pull", e);
    if (sync) { sync.textContent = "连接失败"; sync.className = "sync err"; }
    if (box) {
      box.innerHTML = '<div class="hint">无法加载留言<br>' + esc(e.message || e) +
        '<br><button type="button" class="btn-send" style="margin-top:10px" id="btnRetry">重试</button></div>';
      var r = document.getElementById("btnRetry");
      if (r) r.onclick = pull;
    }
  });
}
function postMsg() {
  if (!token()) { toast("请先登录"); return; }
  var input = document.getElementById("msg");
  var text = ((input && input.value) || "").trim();
  if (!text) { toast("写点内容再发吧"); return; }
  var anonEl = document.getElementById("anonymous");
  var anonymous = !!(anonEl && anonEl.checked);
  api("/wall/messages", {
    method: "POST",
    body: JSON.stringify({ content: text, text: text, anonymous: anonymous, replyTo: replyToId || null })
  }).then(function () {
    if (input) input.value = "";
    clearReply();
    toast("已发送");
    return pull();
  }).catch(function (e) { toast(e.message || "发送失败"); });
}
function setReply(m) {
  if (!token()) { toast("请先登录"); return; }
  replyToId = m.id;
  var input = document.getElementById("msg");
  if (input) { input.value = "@" + (m.nick_display || "匿名") + " "; input.focus(); }
  var c = document.getElementById("cancelReply");
  if (c) c.classList.add("show");
}
function clearReply() {
  replyToId = null;
  var c = document.getElementById("cancelReply");
  if (c) c.classList.remove("show");
}
function like(id) {
  if (!token()) { toast("请先登录再点赞"); return; }
  api("/wall/like", { method: "POST", body: JSON.stringify({ messageId: id }) })
    .then(function () { return pull(); })
    .catch(function (e) { toast(e.message); });
}
function delOwn(id) {
  if (!confirm("确定删除这条留言？")) return;
  api("/wall/delete", { method: "POST", body: JSON.stringify({ messageId: id }) })
    .then(function () { toast("已删除"); return pull(); })
    .catch(function (e) { toast(e.message); });
}
document.getElementById("btnSend").onclick = postMsg;
document.getElementById("cancelReply").onclick = clearReply;
refreshGate();
pull();
setInterval(pull, 10000);
</script>
</body>
</html>
