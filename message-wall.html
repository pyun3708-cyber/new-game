<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>反媚黑高校 · 学校留言墙</title>
  <style>
    :root {
      --ink: #2a2420; --muted: #7a6e64; --accent: #8b765d;
      --card: rgba(255, 250, 244, 0.88); --pink: #c45c7a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink); line-height: 1.55; background: #1a1512;
    }
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse at center, rgba(20,16,14,.35) 0%, rgba(10,8,7,.78) 70%, rgba(8,6,5,.92) 100%),
        #120e0c url("school-badge.png") center center / min(72vmin, 520px) no-repeat;
    }
    .bg::after {
      content: ""; position: absolute; inset: 0;
      background: rgba(18, 14, 12, 0.42); pointer-events: none;
    }
    .wrap {
      position: relative; z-index: 1; max-width: 640px;
      margin: 0 auto; padding: 16px 14px 48px; min-height: 100vh;
    }
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 18px; gap: 10px; flex-wrap: wrap;
    }
    .top-bar a { color: #e8d5c4; text-decoration: none; font-size: 13px; }
    .sync { font-size: 11px; color: #c4b0a0; }
    .sync.ok { color: #9ccc65; }
    .sync.err { color: #ef9a9a; }
    .hero { text-align: center; margin-bottom: 18px; color: #f5ebe0; }
    .hero h1 {
      font-size: 1.45rem; font-weight: 700; letter-spacing: .14em;
      text-shadow: 0 2px 12px rgba(0,0,0,.5);
    }
    .hero p { margin-top: 8px; font-size: 13px; color: #d4c0b0; }
    .panel {
      background: var(--card); border: 1px solid rgba(255,255,255,.35);
      border-radius: 16px; padding: 16px 14px;
      box-shadow: 0 12px 40px rgba(0,0,0,.28);
      backdrop-filter: blur(10px);
    }
    .board-sub { font-size: 12px; color: var(--pink); margin-bottom: 12px; line-height: 1.5; }
    .login-gate {
      text-align: center; padding: 18px 12px; background: rgba(255,255,255,.5);
      border-radius: 12px; margin-bottom: 14px; border: 1px dashed #d0c0b0;
    }
    .login-gate a {
      display: inline-block; margin: 8px 6px 0; padding: 8px 16px;
      background: #8b765d; color: #fff; border-radius: 10px; text-decoration: none; font-size: 14px;
    }
    .msg-form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .msg-form textarea {
      width: 100%; border: 1.5px solid #e0d0c0; border-radius: 12px;
      padding: 10px 12px; font-size: 14px; font-family: inherit; outline: none;
      background: rgba(255,255,255,.85); min-height: 78px; resize: vertical;
    }
    .anon-row {
      display: flex; align-items: center; gap: 8px; font-size: 13px; color: #5a4a40;
    }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      border: none; border-radius: 10px; padding: 10px 16px; font-size: 14px;
      font-weight: 600; cursor: pointer; font-family: inherit;
    }
    .btn-send {
      background: linear-gradient(135deg, #a08060, #8b765d); color: #fff;
      flex: 1; min-width: 120px;
    }
    .btn-cancel-reply { background: #eee6dc; color: #6a5a4a; display: none; }
    .btn-cancel-reply.show { display: inline-block; }
    .btn-like { background: #f5e6dc; color: #8b5a4a; font-size: 12px; padding: 6px 10px; }
    .btn-del { background: #f5d6d6; color: #a33; font-size: 12px; padding: 6px 10px; }
    .btn-reply { background: #e8efe8; color: #4a6a4a; font-size: 12px; padding: 6px 10px; }
    .msg-list { text-align: left; max-height: min(62vh, 560px); overflow-y: auto; }
    .msg {
      background: rgba(255,255,255,.78); border-radius: 12px;
      padding: 10px 12px; margin-bottom: 10px; border: 1px solid #eadcce;
    }
    .msg .meta { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .msg .meta .nick { color: var(--accent); font-weight: 600; }
    .msg .body { font-size: 14px; color: #3a322c; white-space: pre-wrap; word-break: break-word; }
    .msg .actions { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
    .msg.reply { margin-left: 14px; border-left: 3px solid #c4a888; }
    .hint { font-size: 13px; color: var(--muted); text-align: center; padding: 20px 10px; }
    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(16px);
      background: rgba(40, 28, 20, .92); color: #fff; padding: 10px 18px;
      border-radius: 999px; font-size: 13px; opacity: 0; pointer-events: none;
      transition: opacity .2s, transform .2s; z-index: 60;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="wrap">
    <div class="top-bar">
      <a href="school.html">← 返回学校官网</a>
      <span class="sync" id="sync">连接中…</span>
    </div>
    <div class="hero">
      <h1>学校留言墙</h1>
      <p>需登录后发言 · 可选匿名显示</p>
    </div>
    <div class="panel">
      <p class="board-sub">必须登录才能发送。勾选「匿名发言」后公开展示为「匿名」，后台仍关联账号以防滥用（他人看不到你的用户名）。禁止发图。</p>
      <div id="gate" class="login-gate" style="display:none">
        <div>登录后才能发言</div>
        <a href="login.html">去登录</a>
        <a href="register.html" style="background:#6a5a4a">注册账号</a>
      </div>
      <div id="composer" style="display:none">
        <div class="msg-form">
          <div class="anon-row">
            <input type="checkbox" id="anonymous">
            <label for="anonymous">匿名发言（别人只看到「匿名」）</label>
          </div>
          <textarea id="msg" maxlength="500" placeholder="写留言…（禁止发图，最多500字）"></textarea>
          <div class="btn-row">
            <button type="button" class="btn-send" id="btnSend">发送留言</button>
            <button type="button" class="btn-cancel-reply" id="cancelReply">取消回复</button>
          </div>
        </div>
      </div>
      <div class="msg-list" id="list"><div class="hint">加载中…</div></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
<script>
const API_BASE = "https://school-auth.pyun3708.workers.dev";
function token() { return localStorage.getItem("school_token") || ""; }
function user() {
  try { return JSON.parse(localStorage.getItem("school_user") || "null"); }
  catch { return null; }
}
let messages = [];
let replyToId = null;
let me = user();
function toast(m) {
  const el = document.getElementById("toast");
  el.textContent = m;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 2200);
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  }[c]));
}
function fmtTime(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate()) + " " +
    p(d.getHours()) + ":" + p(d.getMinutes());
}
function refreshGate() {
  me = user();
  const logged = !!(token() && me);
  document.getElementById("gate").style.display = logged ? "none" : "block";
  document.getElementById("composer").style.display = logged ? "block" : "none";
}
async function api(path, opts = {}) {
  const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
  if (token()) headers.Authorization = "Bearer " + token();
  const res = await fetch(API_BASE + path, { ...opts, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
  return data;
}
function render() {
  const box = document.getElementById("list");
  if (!messages.length) {
    box.innerHTML = '<div class="hint">还没有留言，来当第一个吧～</div>';
    return;
  }
  const byId = {};
  messages.forEach(m => { byId[m.id] = m; });
  const roots = messages.filter(m => !m.reply_to || !byId[m.reply_to])
    .sort((a, b) => (b.created_at || 0) - (a.created_at || 0));
  const children = {};
  messages.forEach(m => {
    if (m.reply_to && byId[m.reply_to]) {
      (children[m.reply_to] || (children[m.reply_to] = [])).push(m);
    }
  });
  Object.keys(children).forEach(k => {
    children[k].sort((a, b) => (a.created_at || 0) - (b.created_at || 0));
  });
  const myId = me && me.id;
  function card(m, isReply) {
    const likes = m.like_count || 0;
    const liked = !!m.liked_by_me;
    const isOwn = myId && m.user_id === myId;
    const nick = m.nick_display || "匿名";
    return (
      '<div class="msg' + (isReply ? " reply" : "") + '" data-id="' + esc(m.id) + '">' +
        '<div class="meta"><span class="nick">' + esc(nick) + '</span> · ' + fmtTime(m.created_at) +
        (m.reply_to && byId[m.reply_to] ? ' · 回复 ' + esc(byId[m.reply_to].nick_display || "匿名") : "") +
        '</div>' +
        '<div class="body">' + esc(m.text) + '</div>' +
        '<div class="actions">' +
          '<button type="button" class="btn-like" data-act="like">' + (liked ? "已赞 " : "点赞 ") + likes + "</button>" +
          (token() ? '<button type="button" class="btn-reply" data-act="reply">回复</button>' : "") +
          (isOwn ? '<button type="button" class="btn-del" data-act="del">删除</button>' : "") +
        "</div></div>"
    );
  }
  let html = "";
  roots.forEach(m => {
    html += card(m, false);
    (children[m.id] || []).forEach(c => { html += card(c, true); });
  });
  box.innerHTML = html;
  box.querySelectorAll(".msg").forEach(el => {
    const id = el.getAttribute("data-id");
    const m = byId[id];
    if (!m) return;
    el.querySelector('[data-act="like"]')?.addEventListener("click", () => like(m.id));
    el.querySelector('[data-act="reply"]')?.addEventListener("click", () => setReply(m));
    el.querySelector('[data-act="del"]')?.addEventListener("click", () => delOwn(m.id));
  });
}
async function pull() {
  try {
    const data = await api("/wall/messages");
    messages = data.messages || [];
    document.getElementById("sync").textContent = "● 已同步";
    document.getElementById("sync").className = "sync ok";
    render();
  } catch (e) {
    document.getElementById("sync").textContent = "连接失败";
    document.getElementById("sync").className = "sync err";
    document.getElementById("list").innerHTML =
      '<div class="hint">无法加载留言。请确认 Worker 已更新并建好留言表。<br>' + esc(e.message) + "</div>";
  }
}
async function postMsg() {
  if (!token()) { toast("请先登录"); return; }
  const text = document.getElementById("msg").value.trim();
  if (!text) { toast("写点内容再发吧"); return; }
  const anonymous = document.getElementById("anonymous").checked;
  try {
    await api("/wall/messages", {
      method: "POST",
      body: JSON.stringify({ text, anonymous, replyTo: replyToId || null }),
    });
    document.getElementById("msg").value = "";
    clearReply();
    toast("已发送");
    await pull();
  } catch (e) { toast(e.message || "发送失败"); }
}
function setReply(m) {
  if (!token()) { toast("请先登录"); return; }
  replyToId = m.id;
  document.getElementById("msg").value = "@" + (m.nick_display || "匿名") + " ";
  document.getElementById("cancelReply").classList.add("show");
  document.getElementById("msg").focus();
}
function clearReply() {
  replyToId = null;
  document.getElementById("cancelReply").classList.remove("show");
}
async function like(id) {
  if (!token()) { toast("请先登录再点赞"); return; }
  try {
    await api("/wall/like", { method: "POST", body: JSON.stringify({ messageId: id }) });
    await pull();
  } catch (e) { toast(e.message); }
}
async function delOwn(id) {
  if (!confirm("确定删除这条留言？")) return;
  try {
    await api("/wall/delete", { method: "POST", body: JSON.stringify({ messageId: id }) });
    toast("已删除");
    await pull();
  } catch (e) { toast(e.message); }
}
document.getElementById("btnSend").onclick = postMsg;
document.getElementById("cancelReply").onclick = clearReply;
refreshGate();
pull();
setInterval(pull, 8000);
</script>
</body>
</html>
