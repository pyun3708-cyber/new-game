<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>草莓酱🍓的个人主页</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family:
                "Microsoft YaHei",
                "PingFang SC",
                Arial,
                sans-serif;

            background: linear-gradient(
                135deg,
                #ffd6e7,
                #ffb6d5,
                #ffc9df
            );

            color: #6b2948;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;

            background: rgba(255, 255, 255, 0.82);

            border-radius: 28px;

            padding: 50px 30px;

            text-align: center;

            box-shadow:
                0 15px 40px rgba(180, 60, 110, 0.18);

            backdrop-filter: blur(8px);
        }

        .strawberry {
            font-size: 70px;
            margin-bottom: 15px;

            animation: float 3s ease-in-out infinite;
        }

        h1 {
            font-size: 34px;
            color: #d93672;

            margin-bottom: 18px;
        }

        .welcome {
            font-size: 18px;
            line-height: 1.8;

            color: #87405f;

            margin-bottom: 30px;
        }

        .divider {
            width: 80px;
            height: 4px;

            background: #ff82ae;

            border-radius: 10px;

            margin: 0 auto 30px;
        }

        .message {
            font-size: 15px;
            color: #a35b78;

            line-height: 1.8;
        }

        .footer {
            margin-top: 35px;

            font-size: 13px;
            color: #c27b98;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 40px 22px;
                border-radius: 24px;
            }

            .strawberry {
                font-size: 58px;
            }

            h1 {
                font-size: 27px;
            }

            .welcome {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="strawberry">🍓</div>

        <h1>草莓酱🍓的个人主页</h1>

        <div class="divider"></div>

        <p class="welcome">
            欢迎大家来玩~<br>
            草莓酱希望大家都能开心。
        </p>

        <p class="message">
            🌸 欢迎来到草莓酱的主页 🌸
        </p>

        <div class="footer">
            Made with 🍓 &nbsp;·&nbsp; 草莓酱
        </div>

    </main>

</body>
</html>
