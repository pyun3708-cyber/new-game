<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>草莓酱🍓的个人主页</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            background: linear-gradient(135deg, #ffd6e7, #ffb6d5, #ffc9df);
            color: #6b2948;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: rgba(255, 255, 255, 0.84);
            border-radius: 28px;
            padding: 45px 30px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(180, 60, 110, 0.18);
            backdrop-filter: blur(8px);
        }

        .avatar {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 6px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 8px 25px rgba(180, 60, 110, 0.25);
            margin-bottom: 22px;
        }

        h1 {
            font-size: 32px;
            color: #d93672;
            margin-bottom: 18px;
        }

        .divider {
            width: 80px;
            height: 4px;
            background: #ff82ae;
            border-radius: 10px;
            margin: 0 auto 28px;
        }

        .welcome {
            font-size: 18px;
            line-height: 1.9;
            color: #87405f;
        }

        .message {
            margin-top: 25px;
            font-size: 15px;
            color: #a35b78;
        }

        .footer {
            margin-top: 32px;
            font-size: 13px;
            color: #c27b98;
        }

        .exam-card {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            max-width: 430px;
            margin: 30px auto 0;
            padding: 15px 18px;
            background: linear-gradient(135deg, #fff0f6, #ffe3ee);
            border: 1px solid #ffc0d7;
            border-radius: 16px;
            color: #8b3d5d;
            text-decoration: none;
            text-align: left;
            box-shadow: 0 6px 18px rgba(180, 60, 110, 0.10);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .exam-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 9px 22px rgba(180, 60, 110, 0.16);
        }

        .exam-icon {
            font-size: 28px;
            flex: 0 0 auto;
        }

        .exam-card strong {
            display: block;
            font-size: 16px;
            color: #d93672;
        }

        .exam-card small {
            display: block;
            margin-top: 3px;
            font-size: 13px;
            color: #a35b78;
        }

        .exam-arrow {
            margin-left: auto;
            font-size: 22px;
            color: #e36f99;
        }

        @media (max-width: 480px) {
            .container {
                padding: 38px 22px;
                border-radius: 24px;
            }

            .avatar {
                width: 125px;
                height: 125px;
            }

            h1 {
                font-size: 27px;
            }

            .welcome {
                font-size: 16px;
            }
        }
    </style>
</head>
