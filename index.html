<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深渊低语 - 克苏鲁跑团</title>
    <style>
        /* ========== 整体页面样式 ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: #c0b8a0;
            font-family: 'Georgia', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        /* ========== 游戏主容器 ========== */
        #game-container {
            width: 100%;
            max-width: 900px;
            background: #15151c;
            border: 2px solid #3a3a4a;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(80, 20, 80, 0.3);
        }
        /* ========== 顶部标题栏 ========== */
        #header {
            background: linear-gradient(180deg, #2a1a2e, #1a1020);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #4a2a5a;
        }
        #header h1 {
            color: #9a7ab0;
            font-size: 28px;
            letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(150, 100, 180, 0.5);
        }
        /* ========== 角色创建界面 ========== */
        #character-creation {
            padding: 30px;
            display: none;
        }
        #character-creation.active { display: block; }
        .creation-section {
            margin-bottom: 25px;
            padding: 20px;
            background: #1c1c28;
            border-radius: 6px;
            border: 1px solid #333344;
        }
        .creation-section h3 {
            color: #b08ad0;
            margin-bottom: 15px;
            font-size: 18px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            background: #0f0f18;
            border: 1px solid #444455;
            color: #d0c8b0;
            border-radius: 4px;
            font-size: 16px;
            font-family: inherit;
        }
        .profession-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }
        .profession-btn {
            padding: 12px;
            background: #222233;
            border: 2px solid #444455;
            color: #b0a890;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            font-size: 14px;
        }
        .profession-btn:hover {
            background: #332244;
            border-color: #7755aa;
        }
        .profession-btn.selected {
            background: #3a2a50;
            border-color: #9966cc;
            color: #e0d0f0;
        }
        /* ========== 属性显示 ========== */
        .attributes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }
        .attr-item {
            background: #0f0f18;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            border: 1px solid #333344;
        }
        .attr-name { font-size: 12px; color: #888; margin-bottom: 5px; }
        .attr-value { font-size: 24px; color: #d0c090; font-weight: bold; }
        /* ========== 按钮通用样式 ========== */
        .btn {
            padding: 12px 24px;
            background: linear-gradient(180deg, #4a3060, #3a2050);
            border: 2px solid #6a4080;
            color: #e0d0f0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-family: inherit;
            transition: all 0.3s;
        }
        .btn:hover {
            background: linear-gradient(180deg, #5a4070, #4a3060);
            box-shadow: 0 0 15px rgba(120, 60, 160, 0.4);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-center { display: block; margin: 20px auto; }
        /* ========== 游戏主界面 ========== */
        #game-screen { display: none; }
        #game-screen.active { display: block; }
        /* 角色状态面板 */
        #status-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            padding: 15px 20px;
            background: #1a1a25;
            border-bottom: 1px solid #333344;
            font-size: 14px;
        }
        .status-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .status-label { color: #888; }
        .status-value { color: #d0c090; font-weight: bold; }
        .bar-container {
            width: 80px;
            height: 10px;
            background: #222;
            border-radius: 5px;
            overflow: hidden;
        }
        .bar-hp { background: linear-gradient(90deg, #aa3333, #cc5555); height: 100%; transition: width 0.3s; }
        .bar-san { background: linear-gradient(90deg, #3366aa, #5588cc); height: 100%; transition: width 0.3s; }
        /* 剧情文本区域 */
        #story-area {
            padding: 25px;
            min-height: 300px;
            max-height: 500px;
            overflow-y: auto;
            line-height: 1.8;
            font-size: 16px;
        }
        .story-text {
            margin-bottom: 15px;
            animation: fadeIn 0.5s;
        }
        .story-text.narration { color: #b0a890; font-style: italic; }
        .story-text.dialogue { color: #d0c8a0; padding-left: 15px; border-left: 3px solid #554466; }
        .story-text.system { color: #7a9aaa; font-size: 14px; }
        .story-text.dice { color: #ccaa66; font-weight: bold; }
        .story-text.danger { color: #cc5555; }
        .story-text.good { color: #66aa66; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* 选项按钮区域 */
        #choices-area {
            padding: 20px;
            border-top: 1px solid #333344;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .choice-btn {
            padding: 15px;
            background: #1c1c28;
            border: 2px solid #444455;
            color: #c0b8a0;
            border-radius: 4px;
            cursor: pointer;
            text-align: left;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s;
        }
        .choice-btn:hover {
            background: #2a2a40;
            border-color: #7755aa;
            padding-left: 20px;
        }
        .choice-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        /* 物品栏 */
        #inventory-panel {
            padding: 15px 20px;
            background: #1a1a25;
            border-top: 1px solid #333344;
            font-size: 14px;
        }
        #inventory-panel h4 { color: #888; margin-bottom: 8px; }
        .inventory-items { display: flex; flex-wrap: wrap; gap: 8px; }
        .item-tag {
            padding: 4px 10px;
            background: #2a2a3a;
            border: 1px solid #444455;
            border-radius: 12px;
            font-size: 12px;
            color: #a09880;
        }
        /* 滚动条美化 */
        #story-area::-webkit-scrollbar { width: 8px; }
        #story-area::-webkit-scrollbar-track { background: #111; }
        #story-area::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- 顶部标题 -->
        <div id="header">
            <h1>✦ 深 渊 低 语 ✦</h1>
        </div>

        <!-- ====== 第一页：角色创建 ====== -->
        <div id="character-creation" class="active">
            <div class="creation-section">
                <h3>📝 调查员姓名</h3>
                <input type="text" id="char-name" placeholder="输入你的名字..." maxlength="20">
            </div>

            <div class="creation-section">
                <h3>🎭 选择职业</h3>
                <div class="profession-list" id="profession-list">
                    <!-- 职业按钮由JS动态生成 -->
                </div>
            </div>

            <div class="creation-section">
                <h3>📊 角色属性（点击骰子重新随机）</h3>
                <div class="attributes-grid" id="attr-display">
                    <!-- 属性由JS动态生成 -->
                </div>
                <button class="btn btn-center" onclick="rollAttributes()">🎲 重新骰点</button>
            </div>

            <button class="btn btn-center" onclick="startGame()" style="font-size: 18px; padding: 15px 40px;">
                开始调查 →
            </button>
        </div>

        <!-- ====== 第二页：游戏主界面 ====== -->
        <div id="game-screen">
            <!-- 顶部状态栏 -->
            <div id="status-panel">
                <div class="status-item">
                    <span class="status-label">姓名:</span>
                    <span class="status-value" id="display-name">-</span>
                </div>
                <div class="status-item">
                    <span class="status-label">职业:</span>
                    <span class="status-value" id="display-profession">-</span>
                </div>
                <div class="status-item">
                    <span class="status-label">HP:</span>
                    <div class="bar-container"><div class="bar-hp" id="bar-hp"></div></div>
                    <span class="status-value" id="display-hp">-</span>
                </div>
                <div class="status-item">
                    <span class="status-label">SAN:</span>
                    <div class="bar-container"><div class="bar-san" id="bar-san"></div></div>
                    <span class="status-value" id="display-san">-</span>
                </div>
            </div>

            <!-- 剧情文本区 -->
            <div id="story-area"></div>

            <!-- 选项按钮区 -->
            <div id="choices-area"></div>

            <!-- 物品栏 -->
            <div id="inventory-panel">
                <h4>🎒 物品栏</h4>
                <div class="inventory-items" id="inventory-items">
                    <span style="color: #555;">（空）</span>
                </div>
            </div>
        </div>
    </div>

    <script>
    // ============================================================
    // 【第一部分：游戏数据定义】
    // 这里存放所有游戏的基础数据：职业、属性、剧情节点
    // ============================================================

    // ---------- 职业数据 ----------
    // 每个职业有：名字、描述、属性加成、初始技能、初始物品
    const professions = {
        doctor: {
            name: "医生",
            desc: "精通医术，急救和药学技能很高",
            bonus: { 急救: 40, 药学: 30, 心理学: 20 },
            startItems: ["医疗包", "手术刀"]
        },
        detective: {
            name: "私家侦探",
            desc: "善于观察和推理，侦查技能出众",
            bonus: { 侦查: 50, 聆听: 30, 心理学: 25 },
            startItems: ["左轮手枪", "笔记本"]
        },
        professor: {
            name: "大学教授",
            desc: "知识渊博，图书馆使用和学术技能强",
            bonus: { 图书馆使用: 50, 历史学: 40, 外语: 30 },
            startItems: ["古籍残页", "钢笔"]
        },
        journalist: {
            name: "记者",
            desc: "善于沟通和挖掘信息，说服和摄影强",
            bonus: { 说服: 40, 摄影: 35, 侦查: 25 },
            startItems: ["相机", "录音笔"]
        },
        criminal: {
            name: "亡命之徒",
            desc: "身手矫健，格斗和潜行精通",
            bonus: { 格斗: 50, 潜行: 40, 开锁: 30 },
            startItems: ["匕首", "撬锁工具"]
        }
    };

    // ---------- 角色属性 ----------
    // COC标准八大属性：力量、体质、体型、敏捷、外貌、智力、意志、教育
    // 7版规则：大部分属性是3D6×5（15-90），体型/智力/教育是2D6+6再×5（40-90）
    const attrNames = {
        STR: "力量", CON: "体质", SIZ: "体型", DEX: "敏捷",
        APP: "外貌", INT: "智力", POW: "意志", EDU: "教育"
    };

    // ---------- 基础技能列表 ----------
    // 每个人都有的基础技能值（默认很低，职业会加值）
    const baseSkills = {
        侦查: 25, 聆听: 20, 心理学: 10, 急救: 30,
        图书馆使用: 20, 说服: 15, 潜行: 20, 格斗: 25,
        射击: 20, 历史学: 5, 外语: 10, 药学: 5,
        摄影: 10, 开锁: 10, 神秘学: 5
    };

    // ---------- 玩家角色对象 ----------
    // 这是游戏中最重要的变量，存储当前玩家的所有数据
    let player = {
        name: "",
        profession: "",
        attributes: {},  // 存放八大属性
        skills: {},      // 存放所有技能
        hp: 0,           // 生命值
        maxHp: 0,
        san: 0,          // 理智值
        maxSan: 0,
        inventory: [],   // 物品栏
        flags: {}        // 剧情标记（记录玩家做过的选择）
    };

    // ============================================================
    // 【第二部分：骰子系统】
    // COC核心机制：D100骰子，投出的数 ≤ 技能值 = 成功
    // 越小越好！1是极难成功，99+是大失败
    // ============================================================

    /**
     * 投一个D100骰子（1-100）
     * @returns {number} 1到100之间的随机整数
     */
    function rollD100() {
        return Math.floor(Math.random() * 100) + 1;
    }

    /**
     * 投多个D6骰子（用于生成属性）
     * @param {number} count - 骰子数量
     * @returns {number} 骰子总和
     */
    function rollD6(count) {
        let total = 0;
        for (let i = 0; i < count; i++) {
            total += Math.floor(Math.random() * 6) + 1;
        }
        return total;
    }

    /**
     * 技能判定函数（COC核心）
     * @param {string} skillName - 技能名称
     * @param {number} difficulty - 难度倍率（1=普通，0.5=困难，0.2=极难）
     * @returns {object} 判定结果
     */
    function skillCheck(skillName, difficulty = 1) {
        const skillValue = player.skills[skillName] || 0;
        const target = Math.floor(skillValue * difficulty);
        const roll = rollD100();
        let result, level;

        // COC判定规则：
        // 1 = 极难成功（大成功）
        // ≤ 技能值×0.2 = 极难成功
        // ≤ 技能值×0.5 = 困难成功
        // ≤ 技能值 = 普通成功
        // > 技能值 = 失败
        // 96-100（如果技能≤50）或 100 = 大失败
        if (roll === 1) {
            result = "success"; level = "critical";
        } else if (roll <= target * 0.2) {
            result = "success"; level = "extreme";
        } else if (roll <= target * 0.5) {
            result = "success"; level = "hard";
        } else if (roll <= target) {
            result = "success"; level = "normal";
        } else if (roll >= 96 && skillValue <= 50) {
            result = "fumble"; level = "fumble";
        } else if (roll === 100) {
            result = "fumble"; level = "fumble";
        } else {
            result = "failure"; level = "normal";
        }

        return { roll, target, result, level, skillValue };
    }

    /**
     * 理智检定（SAN Check）
     * 遇到恐怖事物时调用，成功掉少，失败掉多
     * @param {number} minLoss - 成功时掉的SAN
     * @param {number} maxLoss - 失败时掉的SAN
     */
    function sanCheck(minLoss, maxLoss) {
        const check = skillCheck("意志", 1);
        // 注意：SAN检定用的是POW意志值
        const powValue = player.attributes.POW;
        const roll = rollD100();
        let loss, result;

        if (roll <= powValue) {
            loss = minLoss;
            result = "success";
        } else {
            loss = maxLoss;
            result = "failure";
        }

        player.san = Math.max(0, player.san - loss);
        updateStatusDisplay();

        return { roll, powValue, loss, result };
    }

    // ============================================================
    // 【第三部分：角色创建系统】
    // 处理角色创建页面的所有逻辑
    // ============================================================

    // 当前选中的职业
    let selectedProfession = null;

    /**
     * 初始化职业选择按钮
     * 页面加载时调用，把professions对象里的职业变成按钮
     */
    function initProfessionList() {
        const list = document.getElementById("profession-list");
        list.innerHTML = "";
        for (let key in professions) {
            const prof = professions[key];
            const btn = document.createElement("button");
            btn.className = "profession-btn";
            btn.innerHTML = `<strong>${prof.name}</strong><br><small>${prof.desc}</small>`;
            btn.onclick = () => selectProfession(key);
            list.appendChild(btn);
        }
    }

    /**
     * 选择职业
     * @param {string} key - 职业的key（如"doctor"）
     */
    function selectProfession(key) {
        selectedProfession = key;
        // 取消所有选中状态
        document.querySelectorAll(".profession-btn").forEach(b => b.classList.remove("selected"));
        // 给选中的加样式
        event.target.closest(".profession-btn").classList.add("selected");
    }

    /**
     * 随机生成角色属性
     * 按照COC规则：大部分属性3D6×5，体型/智力/教育2D6+6再×5
     */
    function rollAttributes() {
        const attrs = {};
        // 普通属性：3D6 × 5
        attrs.STR = rollD6(3) * 5;  // 力量
        attrs.CON = rollD6(3) * 5;  // 体质
        attrs.DEX = rollD6(3) * 5;  // 敏捷
        attrs.APP = rollD6(3) * 5;  // 外貌
        attrs.POW = rollD6(3) * 5;  // 意志
        // 特殊属性：(2D6+6) × 5
        attrs.SIZ = (rollD6(2) + 6) * 5;  // 体型
        attrs.INT = (rollD6(2) + 6) * 5;  // 智力
        attrs.EDU = (rollD6(2) + 6) * 5;  // 教育

        displayAttributes(attrs);
        return attrs;
    }

    /**
     * 在页面上显示属性
     */
    function displayAttributes(attrs) {
        const container = document.getElementById("attr-display");
        container.innerHTML = "";
        for (let key in attrs) {
            const div = document.createElement("div");
            div.className = "attr-item";
            div.innerHTML = `
                <div class="attr-name">${attrNames[key]} (${key})</div>
                <div class="attr-value">${attrs[key]}</div>
            `;
            container.appendChild(div);
        }
    }

    // 存储当前随机出来的属性
    let currentAttributes = null;

    // ============================================================
    // 【第四部分：游戏主逻辑】
    // 开始游戏、显示剧情、处理选项
    // ============================================================

    /**
     * 开始游戏
     * 读取玩家输入的名字、选择的职业，初始化角色数据
     */
    function startGame() {
        const name = document.getElementById("char-name").value.trim();
        
        // 检查输入
        if (!name) { alert("请输入你的名字！"); return; }
        if (!selectedProfession) { alert("请选择一个职业！"); return; }
        if (!currentAttributes) { alert("请先骰点生成属性！"); return; }

        // 初始化玩家数据
        player.name = name;
        player.profession = selectedProfession;
        player.attributes = { ...currentAttributes };
        
        // 初始化技能（基础值 + 职业加成）
        player.skills = { ...baseSkills };
        const profBonus = professions[selectedProfession].bonus;
        for (let skill in profBonus) {
            player.skills[skill] = (player.skills[skill] || 0) + profBonus[skill];
        }

        // 计算HP和SAN
        // HP = (体质 + 体型) / 10
        player.maxHp = Math.floor((player.attributes.CON + player.attributes.SIZ) / 10);
        player.hp = player.maxHp;
        // SAN = 意志值
        player.maxSan = player.attributes.POW;
        player.san = player.maxSan;

        // 初始物品
        player.inventory = [...professions[selectedProfession].startItems];

        // 切换到游戏界面
        document.getElementById("character-creation").classList.remove("active");
        document.getElementById("game-screen").classList.add("active");

        // 更新显示
        updateStatusDisplay();
        updateInventoryDisplay();

        // 开始剧情（从第一个节点开始）
        showNode("start");
    }

    /**
     * 更新顶部状态栏显示
     */
    function updateStatusDisplay() {
        document.getElementById("display-name").textContent = player.name;
        document.getElementById("display-profession").textContent = professions[player.profession].name;
        document.getElementById("display-hp").textContent = `${player.hp}/${player.maxHp}`;
        document.getElementById("display-san").textContent = `${player.san}/${player.maxSan}`;
        document.getElementById("bar-hp").style.width = (player.hp / player.maxHp * 100) + "%";
        document.getElementById("bar-san").style.width = (player.san / player.maxSan * 100) + "%";
    }

    /**
     * 更新物品栏显示
     */
    function updateInventoryDisplay() {
        const container = document.getElementById("inventory-items");
        if (player.inventory.length === 0) {
            container.innerHTML = '<span style="color: #555;">（空）</span>';
            return;
        }
        container.innerHTML = "";
        player.inventory.forEach(item => {
            const span = document.createElement("span");
            span.className = "item-tag";
            span.textContent = item;
            container.appendChild(span);
        });
    }

    /**
     * 向剧情区添加一段文字
     * @param {string} text - 文字内容
     * @param {string} type - 类型：narration/dialogue/system/dice/danger/good
     */
    function addStoryText(text, type = "narration") {
        const area = document.getElementById("story-area");
        const p = document.createElement("p");
        p.className = `story-text ${type}`;
        p.innerHTML = text;
        area.appendChild(p);
        // 自动滚动到底部
        area.scrollTop = area.scrollHeight;
    }

    /**
     * 清空剧情区和选项区
     */
    function clearStory() {
        document.getElementById("story-area").innerHTML = "";
        document.getElementById("choices-area").innerHTML = "";
    }

    /**
     * 显示选项按钮
     * @param {Array} choices - 选项数组，每个选项有text和next属性
     */
    function showChoices(choices) {
        const area = document.getElementById("choices-area");
        area.innerHTML = "";
        choices.forEach(choice => {
            const btn = document.createElement("button");
            btn.className = "choice-btn";
            btn.textContent = choice.text;
            btn.onclick = () => {
                // 点击后禁用所有按钮，防止连点
                document.querySelectorAll(".choice-btn").forEach(b => b.disabled = true);
                // 执行选项的动作
                if (choice.action) choice.action();
                // 跳转到下一个剧情节点
                if (choice.next) showNode(choice.next);
            };
            area.appendChild(btn);
        });
    }

    // ============================================================

    // ============================================================

    /**
     * 显示一个剧情节点
     * @param {string} nodeId - 节点的ID（在storyNodes里找）
     */
    function showNode(nodeId) {
        const node = storyNodes[nodeId];
        if (!node) {
            addStoryText("（剧情错误：找不到节点 " + nodeId + "）", "system");
            return;
        }

        // 如果节点有进入时执行的函数，先执行
        if (node.onEnter) node.onEnter();

        // 逐段显示剧情文字（用setTimeout做出打字机效果的感觉）
        let i = 0;
        function showNext() {
            if (i < node.text.length) {
                const t = node.text[i];
                addStoryText(t.text, t.type);
                i++;
                setTimeout(showNext, 300); // 每段间隔300毫秒
            } else {
                // 文字显示完了，显示选项
                showChoices(node.choices);
            }
        }
        showNext();
    }

    // ============================================================
    // 【第七部分：技能判定包装函数】
    // 让剧情选项里调用技能判定更方便
    // ============================================================

    /**
     * 执行技能判定并跳转到对应结果
     * @param {string} skill - 技能名
     * @param {string} baseNode - 基础节点名（会自动加_success或_failure）
     * @param {number} difficulty - 难度（默认1=普通）
     */
    function doSkillCheck(skill, baseNode, difficulty = 1) {
        const result = skillCheck(skill, difficulty);
        
        // 显示骰子结果
        let levelText = "";
        if (result.level === "critical") levelText = "（大成功！）";
        else if (result.level === "extreme") levelText = "（极难成功）";
        else if (result.level === "hard") levelText = "（困难成功）";
        else if (result.level === "fumble") levelText = "（大失败！）";
        
        addStoryText(
            `🎲 投骰：${result.roll} / 目标：${result.target}（${skill} ${result.skillValue}）${levelText}`,
            "dice"
        );

        // 根据结果跳转
        setTimeout(() => {
            if (result.result === "success" || result.level === "critical") {
                showNode(baseNode + "_success");
            } else {
                showNode(baseNode + "_failure");
            }
        }, 800);
    }

    /**
     * 理智检定包装函数
     */
    function sanCheckWrapper(min, max, nextNode) {
        const result = sanCheck(min, max);
        addStoryText(
            `🧠 SAN检定：投出 ${result.roll} / 意志 ${result.powValue} → ${result.result === "success" ? "成功" : "失败"}<br>失去 ${result.loss} 点理智（当前 ${player.san}/${player.maxSan}）`,
            result.result === "success" ? "good" : "danger"
        );

        // 检查是否疯狂
        if (player.san <= 0) {
            setTimeout(() => showNode("end_insane"), 1000);
            return;
        }

        setTimeout(() => showNode(nextNode), 1000);
    }

    // 【第八部分：战斗系统（简化版）】
    // 以后可以扩展得更复杂
    // ============================================================

    function doCombat(resultNode) {
        // 简化版：直接用格斗技能判定
        const result = skillCheck("格斗", 1);
        addStoryText(`⚔️ 战斗！投骰：${result.roll} / 格斗 ${result.skillValue}`, "dice");

        setTimeout(() => {
            if (result.result === "success") {
                addStoryText("你成功击倒了敌人！", "good");
                damagePlayer(1); // 即使赢了也受点伤
            } else {
                addStoryText("你被击中了！", "danger");
                damagePlayer(3);
            }

            setTimeout(() => {
                if (player.hp <= 0) {
                    showNode("end_dead");
                } else {
                    // 战斗后根据场景跳转
                    if (resultNode === "inn_fight") {
                        showNode("inn_after_fight");
                    } else if (resultNode === "cave_fight" || resultNode === "final_fight") {
                        showNode("after_fight");
                    } else {
                        showNode("go_to_town");
                    }
                }
            }, 1000);
        }, 800);
    }

    // ============================================================
    // 【第九部分：辅助函数】
    // 物品管理、伤害治疗、游戏结束等
    // ============================================================

    /**
     * 添加物品到背包
     */
    function addItem(item) {
        if (!player.inventory.includes(item)) {
            player.inventory.push(item);
            updateInventoryDisplay();
        }
    }

    /**
     * 移除物品
     */
    function removeItem(item) {
        const index = player.inventory.indexOf(item);
        if (index > -1) {
            player.inventory.splice(index, 1);
            updateInventoryDisplay();
        }
    }

    /**
     * 玩家受到伤害
     */
    function damagePlayer(amount) {
        player.hp = Math.max(0, player.hp - amount);
        updateStatusDisplay();
        if (player.hp <= 0) {
            setTimeout(() => showNode("end_dead"), 1000);
        }
    }

    /**
     * 玩家恢复生命
     */
    function healPlayer(amount) {
        player.hp = Math.min(player.maxHp, player.hp + amount);
        updateStatusDisplay();
    }

    /**
     * 游戏结束
     */
    function endGame(ending) {
        addStoryText(`<br>━━━━━━━━━━━━━━━━━━<br>结局：${ending}<br>━━━━━━━━━━━━━━━━━━`, "system");
        addStoryText(`<br>调查员：${player.name}<br>职业：${professions[player.profession].name}<br>最终HP：${player.hp}/${player.maxHp}<br>最终SAN：${player.san}/${player.maxSan}<br>物品：${player.inventory.join("、") || "无"}`, "system");
    }
