<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人主页 · 反媚黑高校</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;font-family:"PingFang SC","Microsoft YaHei",sans-serif;
      color:#2a2420;background:#1a1512;
    }
    .bg-layer{
      position:fixed;inset:0;z-index:0;
      background-color:#1a1512;
      background-size:cover;background-position:center;
      filter:brightness(.55);
    }
    .bg-layer::after{
      content:"";position:absolute;inset:0;
      background:linear-gradient(180deg,rgba(10,8,6,.35),rgba(10,8,6,.75));
    }
    .wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:16px 14px 48px}
    .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
    .top a{color:#e8d5c4;text-decoration:none;font-size:13px}
    .card{
      background:rgba(255,250,244,.9);border-radius:18px;padding:22px 18px;
      box-shadow:0 16px 48px rgba(0,0,0,.35);backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,.35);
    }
    .head{display:flex;gap:16px;align-items:center}
    .avatar{
      width:88px;height:88px;border-radius:50%;object-fit:cover;
      background:#ddd;border:3px solid #fff;box-shadow:0 4px 16px rgba(0,0,0,.2);flex-shrink:0;
    }
    .avatar-ph{
      width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,#c4a888,#8b765d);
      display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px;font-weight:700;
      border:3px solid #fff;flex-shrink:0;
    }
    .name{font-size:1.35rem;font-weight:700;letter-spacing:.04em}
    .meta{font-size:13px;color:#6a5a4a;margin-top:4px;line-height:1.6}
    .badge{
      display:inline-block;margin-top:6px;padding:2px 10px;border-radius:999px;
      font-size:12px;background:#8b765d;color:#fff;
    }
    .badge.teacher{background:#c45c7a}
    .section{margin-top:18px;padding-top:14px;border-top:1px solid rgba(0,0,0,.08)}
    .section h3{font-size:14px;color:#8b765d;margin-bottom:8px;letter-spacing:.08em}
    .bio{font-size:14px;line-height:1.7;color:#3a322c;white-space:pre-wrap;word-break:break-word}
    .empty{color:#999;font-size:13px}
    .btn{
      display:inline-block;margin-top:12px;padding:10px 16px;border:none;border-radius:10px;
      background:linear-gradient(135deg,#a08060,#8b765d);color:#fff;font-size:14px;
      font-weight:600;cursor:pointer;font-family:inherit;text-decoration:none;
    }
    .btn-secondary{background:#eee6dc;color:#5a4a3a;margin-left:8px}
    .err{color:#c62828;font-size:13px;margin-top:10px}
    .edit label{display:block;font-size:12px;color:#666;margin:12px 0 4px}
    .edit input,.edit select,.edit textarea{
      width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid #e0d0c0;
      font-size:14px;font-family:inherit;outline:none;background:#fff;
    }
    .edit textarea{min-height:90px;resize:vertical}
    .row-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
    .hint{font-size:11px;color:#999;margin-top:4px}
    .preview-row{display:flex;gap:12px;align-items:center;margin-top:8px;flex-wrap:wrap}
    .preview-row img{max-width:80px;max-height:80px;border-radius:8px;object-fit:cover}
  </style>
</head>
<body>
  <div class="bg-layer" id="bgLayer"></div>
  <div class="wrap">
    <div class="top">
      <a href="school.html">← 返回学校官网</a>
      <span id="topRight"></span>
    </div>
    <div class="card" id="main">
      <div class="empty" style="text-align:center;padding:24px">加载中…</div>
    </div>
  </div>
<script>
const API_BASE = "https://school-auth.pyun3708.workers.dev";
function token(){ return localStorage.getItem("school_token")||""; }
function me(){ try{return JSON.parse(localStorage.getItem("school_user")||"null");}catch{return null;} }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
function qs(name){ return new URLSearchParams(location.search).get(name); }
function daysSince(ts){
  if(!ts) return "—";
  const d = Math.floor((Date.now()-Number(ts))/86400000);
  return d<0?0:d;
}
function fmtDate(ts){
  if(!ts) return "—";
  const d=new Date(Number(ts));
  const p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}
async function api(path, opts={}){
  const headers={"Content-Type":"application/json",...(opts.headers||{})};
  if(token()) headers.Authorization="Bearer "+token();
  const res=await fetch(API_BASE+path,{...opts,headers});
  const data=await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error||("HTTP "+res.status));
  return data;
}
function compressImage(file, maxSide, quality){
  return new Promise((resolve,reject)=>{
    if(!file||!file.type.startsWith("image/")) return reject(new Error("请选择图片"));
    if(file.size>8*1024*1024) return reject(new Error("图片请小于 8MB"));
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      let w=img.width,h=img.height;
      const scale=Math.min(1, maxSide/Math.max(w,h));
      w=Math.round(w*scale); h=Math.round(h*scale);
      const canvas=document.createElement("canvas");
      canvas.width=w; canvas.height=h;
      canvas.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      let q=quality;
      let data=canvas.toDataURL("image/jpeg",q);
      while(data.length>180000 && q>0.35){ q-=0.08; data=canvas.toDataURL("image/jpeg",q); }
      if(data.length>220000) return reject(new Error("图片仍过大，请换一张更小的"));
      resolve(data);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("图片读取失败"));};
    img.src=url;
  });
}
let profile=null, isSelf=false, editMode=false, draftAvatar=null, draftBg=null;
async function load(){
  const u=qs("u");
  const self=me();
  try{
    let data;
    if(u) data=await api("/profile/"+encodeURIComponent(u));
    else if(token()&&self) data=await api("/profile/me");
    else {
      document.getElementById("main").innerHTML=
        '<div style="text-align:center;padding:20px">请先 <a href="login.html">登录</a> 查看自己的主页。</div>';
      return;
    }
    profile=data.profile;
    isSelf=!!(self&&profile&&self.id===profile.id);
    if(profile.bg_image){
      document.getElementById("bgLayer").style.backgroundImage='url("'+profile.bg_image.replace(/"/g,'')+'")';
    }
    render();
  }catch(e){
    document.getElementById("main").innerHTML='<div class="err" style="padding:16px">'+esc(e.message)+'</div>';
  }
}
function render(){
  const p=profile;
  const role=p.role==="teacher"?"教师":"学生";
  const call=p.display_name||p.username;
  const initial=(call||"?").slice(0,1);
  if(editMode&&isSelf){
    document.getElementById("main").innerHTML=`
      <div class="edit">
        <h3 style="font-size:16px;margin-bottom:8px">编辑个人主页</h3>
        <label>头像</label>
        <input type="file" id="avFile" accept="image/*">
        <div class="preview-row"><img id="avPrev" style="display:none;border-radius:50%;width:72px;height:72px"></div>
        <label>称呼</label>
        <input id="display_name" maxlength="20" value="${esc(p.display_name||"")}">
        <label>性别</label>
        <select id="gender">
          <option value="">不展示</option>
          <option value="男">男</option>
          <option value="女">女</option>
          <option value="男娘">男娘</option>
          <option value="其他">其他</option>
          <option value="不愿透露">不愿透露</option>
        </select>
        <label>生日</label>
        <input id="birthday" type="date" value="${esc(p.birthday||"")}">
        <label>个人介绍</label>
        <textarea id="bio" maxlength="500">${esc(p.bio||"")}</textarea>
        <label>主页背景图</label>
        <input type="file" id="bgFile" accept="image/*">
        <p class="hint">图片会自动压缩后保存。</p>
        <div class="row-btns">
          <button type="button" class="btn" id="saveBtn">保存</button>
          <button type="button" class="btn btn-secondary" id="cancelBtn">取消</button>
        </div>
        <div class="err" id="err"></div>
      </div>`;
    document.getElementById("gender").value=p.gender||"";
    document.getElementById("avFile").onchange=async (e)=>{
      try{
        draftAvatar=await compressImage(e.target.files[0], 400, 0.72);
        const im=document.getElementById("avPrev");
        im.src=draftAvatar; im.style.display="block";
      }catch(err){ document.getElementById("err").textContent=err.message; }
    };
    document.getElementById("bgFile").onchange=async (e)=>{
      try{
        draftBg=await compressImage(e.target.files[0], 1280, 0.7);
        document.getElementById("bgLayer").style.backgroundImage='url("'+draftBg+'")';
      }catch(err){ document.getElementById("err").textContent=err.message; }
    };
    document.getElementById("cancelBtn").onclick=()=>{editMode=false;draftAvatar=null;draftBg=null;render();};
    document.getElementById("saveBtn").onclick=save;
    return;
  }
  const av=p.avatar
    ? `<img class="avatar" src="${esc(p.avatar)}" alt="">`
    : `<div class="avatar-ph">${esc(initial)}</div>`;
  document.getElementById("main").innerHTML=`
    <div class="head">
      ${av}
      <div>
        <div class="name">${esc(call)}</div>
        <div class="meta">@${esc(p.username)}</div>
        <span class="badge ${p.role==="teacher"?"teacher":""}">${esc(role)}</span>
      </div>
    </div>
    <div class="section">
      <h3>资料</h3>
      <div class="meta">
        性别：${esc(p.gender||"未填写")}<br>
        生日：${esc(p.birthday||"未填写")}<br>
        入学时间：${fmtDate(p.created_at)}（距今 ${daysSince(p.created_at)} 天）
      </div>
    </div>
    <div class="section">
      <h3>个人介绍</h3>
      <div class="bio">${p.bio?esc(p.bio):'<span class="empty">这个人很懒，还没有介绍</span>'}</div>
    </div>
    ${isSelf?`<button type="button" class="btn" id="editBtn">编辑主页</button>`:""}
  `;
  if(isSelf) document.getElementById("editBtn").onclick=()=>{editMode=true;draftAvatar=null;draftBg=null;render();};
}
async function save(){
  const err=document.getElementById("err");
  err.textContent="";
  const body={
    display_name: document.getElementById("display_name").value.trim(),
    gender: document.getElementById("gender").value,
    birthday: document.getElementById("birthday").value,
    bio: document.getElementById("bio").value.trim(),
  };
  if(draftAvatar) body.avatar=draftAvatar;
  if(draftBg) body.bg_image=draftBg;
  try{
    const data=await api("/profile/update",{method:"POST",body:JSON.stringify(body)});
    profile=data.profile;
    editMode=false; draftAvatar=null; draftBg=null;
    if(profile.bg_image) document.getElementById("bgLayer").style.backgroundImage='url("'+profile.bg_image.replace(/"/g,"")+'")';
    render();
  }catch(e){ err.textContent=e.message; }
}
load();
</script>
</body>
</html>
