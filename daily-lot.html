<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>反媚黑高校 · 每日一签</title>
<style>
  :root{
    --bg:#f3ebe0;
    --card:#fffaf2;
    --ink:#3a2a1a;
    --gold:#c4a574;
    --gold-deep:#8b6914;
    --red:#c45c3e;
    --red-deep:#a04030;
    --muted:#9a8b78;
    --line:#e6d5bc;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at 20% 0%, #fff6e8 0%, transparent 50%),
      radial-gradient(ellipse at 80% 100%, #f0e0cc 0%, transparent 45%),
      var(--bg);
    font-family:"Songti SC","SimSun","STSong",serif;
    color:var(--ink);
    overflow-x:hidden;
  }
  .wrap{
    max-width:480px;
    margin:0 auto;
    padding:16px 16px 40px;
    position:relative;
  }
  header{
    text-align:center;
    padding:12px 0 8px;
  }
  header h1{
    font-size:18px;
    font-weight:700;
    letter-spacing:.2em;
    color:var(--gold-deep);
  }
  header .sub{
    font-size:12px;
    color:var(--muted);
    margin-top:4px;
    letter-spacing:.15em;
  }
  .gender{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:12px 0 8px;
  }
  .gender button{
    border:1px solid var(--gold);
    background:#fff;
    color:var(--ink);
    padding:6px 18px;
    font-size:13px;
    border-radius:20px;
    cursor:pointer;
    font-family:inherit;
  }
  .gender button.on{
    background:linear-gradient(180deg,#e8c98a,#c4a574);
    color:#3a2a1a;
    border-color:var(--gold-deep);
    font-weight:700;
  }

  .stage{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin:10px 0 6px;
    min-height:420px;
  }
  .side-title{
    writing-mode:vertical-rl;
    text-orientation:mixed;
    font-size:15px;
    letter-spacing:.45em;
    color:var(--gold-deep);
    border:1px solid var(--gold);
    padding:16px 8px;
    background:linear-gradient(180deg,#fffaf0,#f5e6c8);
    border-radius:4px;
    box-shadow:0 2px 8px rgba(139,105,20,.12);
    height:200px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .card-scene{
    width:min(280px,72vw);
    height:380px;
    perspective:1200px;
  }
  .card{
    width:100%;
    height:100%;
    position:relative;
    transform-style:preserve-3d;
    transition:transform .8s cubic-bezier(.4,.1,.2,1);
    cursor:default;
  }
  .card.flipped{transform:rotateY(180deg)}
  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius:8px;
    border:2px solid var(--gold);
    background:linear-gradient(180deg,#fffdf8 0%,#fff6e6 100%);
    box-shadow:0 8px 28px rgba(80,50,20,.15);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:16px 14px;
    overflow:hidden;
  }
  .face::before{
    content:"";
    position:absolute;inset:10px;
    border:1px solid rgba(196,165,116,.45);
    border-radius:4px;
    pointer-events:none;
    z-index:1;
  }
  .face.back{
    transform:rotateY(180deg);
    justify-content:flex-start;
    padding-top:18px;
  }

  .face.front .seal{
    width:88px;height:88px;
    border:3px solid var(--red);
    color:var(--red);
    border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    font-size:28px;font-weight:700;
    letter-spacing:.15em;
    transform:rotate(-8deg);
    opacity:.9;
  }
  .face.front .hint{
    margin-top:28px;
    font-size:12px;
    color:var(--muted);
    letter-spacing:.2em;
  }

  .rank-badge{
    display:inline-block;
    padding:3px 12px;
    border-radius:3px;
    font-size:12px;
    letter-spacing:.2em;
    margin-bottom:8px;
    border:1px solid;
    position:relative;
    z-index:2;
  }
  .rank-上上签{background:#fff3d6;color:#8b6914;border-color:#c4a574}
  .rank-上签{background:#f5efe3;color:#6b5420;border-color:#c4a574}
  .rank-中签{background:#f0f0f0;color:#666;border-color:#bbb}
  .rank-下签{background:#f8e8e4;color:#8b3a2a;border-color:#d4a090}
  .rank-下下签{background:#2a1810;color:#e8c4a0;border-color:#5a3020}

  .lot-title{
    font-size:28px;
    font-weight:700;
    letter-spacing:.25em;
    color:var(--gold-deep);
    margin:2px 0 8px;
    position:relative;
    z-index:2;
  }

  .lot-img-wrap{
    width:100%;
    max-width:200px;
    height:120px;
    margin:4px 0 8px;
    border-radius:4px;
    border:1px solid var(--line);
    background:#1a120c;
    overflow:hidden;
    position:relative;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .lot-img-wrap img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    display:block;
  }
  .lot-img-wrap .img-fallback{
    font-size:11px;
    color:#8a7a68;
    letter-spacing:.1em;
    display:none;
  }

  .lot-verse{
    font-size:13px;
    line-height:1.75;
    text-align:center;
    color:var(--ink);
    letter-spacing:.06em;
    position:relative;
    z-index:2;
  }
  .lot-verse div{margin:1px 0}

  .actions{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    margin-top:8px;
  }
  .btn-draw{
    width:88px;height:88px;
    border-radius:50%;
    border:none;
    background:radial-gradient(circle at 35% 30%,#e87860,#c45c3e 55%,#a04030);
    color:#fff;
    font-size:18px;
    font-weight:700;
    letter-spacing:.15em;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(160,64,48,.35), inset 0 2px 0 rgba(255,255,255,.25);
    font-family:inherit;
    transition:transform .15s, filter .15s;
  }
  .btn-draw:active{transform:scale(.96)}
  .btn-draw:disabled{
    filter:grayscale(.5) brightness(.85);
    cursor:not-allowed;
    box-shadow:none;
  }
  .status-line{
    font-size:12px;
    color:var(--muted);
    letter-spacing:.08em;
    text-align:center;
    min-height:18px;
  }

  .extra-panel{
    display:none;
    margin:14px 0 0;
    padding:14px;
    background:#fffaf2;
    border:1px solid var(--line);
    border-radius:8px;
  }
  .extra-panel.show{display:block}
  .extra-panel h3{
    font-size:13px;
    color:var(--gold-deep);
    margin-bottom:10px;
    letter-spacing:.12em;
    text-align:center;
  }
  .extra-row{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .q-block{
    background:#fff;
    border:1px dashed var(--line);
    padding:10px;
    border-radius:6px;
  }
  .q-block p{font-size:13px;margin-bottom:8px;text-align:center}
  .q-btns{display:flex;gap:8px;justify-content:center}
  .q-btns button, .sponsor-btn{
    border:1px solid var(--gold);
    background:#fff;
    color:var(--ink);
    padding:7px 14px;
    font-size:12px;
    border-radius:16px;
    cursor:pointer;
    font-family:inherit;
  }
  .sponsor-btn{
    width:100%;
    background:linear-gradient(180deg,#fff6e0,#f0d9a8);
    font-weight:700;
    letter-spacing:.1em;
  }
  .sponsor-btn:active{filter:brightness(.97)}

  .stats{
    margin-top:20px;
    padding:14px;
    background:rgba(255,250,242,.9);
    border:1px solid var(--line);
    border-radius:8px;
  }
  .stats h3{
    font-size:13px;
    letter-spacing:.15em;
    color:var(--gold-deep);
    text-align:center;
    margin-bottom:10px;
  }
  .stats-meta{
    font-size:12px;
    color:var(--muted);
    text-align:center;
    margin-bottom:10px;
  }
  .stats-meta strong{color:var(--ink)}
  .chip-grid{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    justify-content:center;
  }
  .chip{
    font-size:11px;
    padding:4px 8px;
    border-radius:3px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--muted);
  }
  .chip.got{
    background:#fff3d6;
    border-color:var(--gold);
    color:var(--ink);
  }
  .chip .r{font-size:10px;opacity:.75;margin-left:2px}

  .footer-note{
    text-align:center;
    font-size:11px;
    color:var(--muted);
    margin-top:16px;
    line-height:1.6;
  }
</style>
</head>
<body>
<div class="wrap">
  <div style="text-align:left;margin-bottom:4px">
    <a href="student-council.html" style="font-size:12px;color:#8b6914;text-decoration:none;letter-spacing:.08em">← 返回学生会</a>
  </div>
  <header>
    <h1>反媚黑高校</h1>
    <div class="sub">每 日 一 签</div>
  </header>

  <div class="gender">
    <button type="button" id="btnMale" class="on" onclick="setGender('male')">男生卷</button>
    <button type="button" id="btnFemale" onclick="setGender('female')">女生卷</button>
  </div>

  <div class="stage">
    <div class="card-scene">
      <div class="card" id="card">
        <div class="face front">
          <div class="seal">求签</div>
          <div class="hint">静心 · 问今日</div>
        </div>
        <div class="face back" id="cardBack">
          <div class="rank-badge rank-中签" id="rankBadge">中签</div>
          <div class="lot-title" id="lotTitle">观局</div>
          <div class="lot-img-wrap">
            <img id="lotImg" alt="签面配图" decoding="async">
            <span class="img-fallback" id="imgFallback">配图加载中…</span>
          </div>
          <div class="lot-verse" id="lotVerse"></div>
        </div>
      </div>
    </div>
    <div class="side-title">每日一签</div>
  </div>

  <div class="actions">
    <button class="btn-draw" id="btnDraw" type="button" onclick="drawLot()">抽签</button>
    <div class="status-line" id="statusLine">今日尚未抽签</div>
  </div>

  <div class="extra-panel" id="extraPanel">
    <h3>今日次数已用尽 · 想再抽一次？</h3>
    <div class="extra-row">
      <div class="q-block">
        <p>今天你高潮了吗？</p>
        <div class="q-btns">
          <button type="button" onclick="answerClimax(false)">没有</button>
          <button type="button" onclick="answerClimax(true)">高潮了</button>
        </div>
      </div>
      <button type="button" class="sponsor-btn" onclick="sponsorSchool()">赞助学校一块钱 · 再抽一次</button>
    </div>
  </div>

  <div class="stats">
    <h3>签文收集</h3>
    <div class="stats-meta" id="statsMeta">已收集 <strong>0</strong> / <strong>0</strong> · 未集齐</div>
    <div class="chip-grid" id="chipGrid"></div>
  </div>

  <div class="footer-note">
    每日免费一签 · 中签罕见<br>
    本签仅供娱乐，自愿角色扮演向
  </div>
</div>

<script>
/**
 * 图片目录与命名（上传 GitHub 时保持一致）：
 *   img/m1.png … img/m15.png   男生卷
 *   img/w1.png … img/w15.png   女生卷
 * 也支持 .jpg（png 不存在会自动试 jpg）
 *
 * 编号 = 上上1-3 → 上4-6 → 中7-9 → 下10-12 → 下下13-15
 * 与 LOTS 顺序一一对应。
 */
const IMG_BASE = "img/";

const LOTS = {
  male: {
    上上签: [
      { key:"媚黑", img:1, lines:["黑爹一声膝已软","黄皮俯首不敢言","今日心甘称废物","专程跪侍黑阴茎"] },
      { key:"迎屄", img:2, lines:["娇妻腿张开待客","黑阳具入湿无声","你在一旁递毛巾","看她高潮喊黑爹"] },
      { key:"送妻", img:3, lines:["亲手把妻送黑爹","床上浪叫你门外","精液灌满她子宫","回来还要你去舔"] }
    ],
    上签: [
      { key:"释放", img:4, lines:["锁开一次准你射","射完继续戴回去","精关钥匙在黑爹","何时能爽由他定"] },
      { key:"听声", img:5, lines:["黑人操你老婆时","你在门外听床响","一声深过一声浪","听硬了也不许进"] },
      { key:"遇贵", img:6, lines:["路上撞见真黑爹","皮肤黝黑阳具粗","若敢上前自报贱","有望跪舔求一用"] }
    ],
    中签: [
      { key:"观局", img:7, lines:["黑爹肏人你靠边","看得清楚摸不得","心痒难耐也只看","这就是你的本分"] },
      { key:"试探", img:8, lines:["想媚还羞半推就","黑阳具顶在嘴边","今日含进半截去","明日才能整根咽"] },
      { key:"随波", img:9, lines:["别人媚黑你跟着","黑爹没瞧你也跪","浪潮推来便受着","别问自己为什么"] }
    ],
    下签: [
      { key:"金蹴", img:10, lines:["黑爹一脚踢你蛋","痛得蜷缩地上滚","还得爬起来道谢","谢谢黑爹愿踩你"] },
      { key:"入穴", img:11, lines:["黑阳具捅进屁眼","撑开肠壁你浪叫","前头小鸡完全废","后穴倒成接客道"] },
      { key:"贡金", img:12, lines:["工资上贡给黑爹","自己吃糠她吃肉","钱交完了身更轻","正好专心去舔黑"] }
    ],
    下下签: [
      { key:"毁坏", img:13, lines:["鸡巴玩坏蛋打肿","屁眼松垮合不拢","从此只能当玩具","黑爹用完踢去睡"] },
      { key:"堕落", img:14, lines:["一层层把底线破","跪舔黑爹已上瘾","想起从前装正经","自己都觉得可笑"] },
      { key:"失神", img:15, lines:["眼睛翻白神智空","黑阳具还在嘴中","叫你名字无反应","身体只会抖着高潮"] }
    ]
  },
  female: {
    上上签: [
      { key:"媚黑", img:1, lines:["黑爹临身腿自开","黑皮肤压得你喘","从前洁身今日贱","专吃黑阳具的精"] },
      { key:"迎茎", img:2, lines:["双腿张到最开处","黑阴茎对准花心","一下到底宫口撞","爽得你哭着求更深"] },
      { key:"卖友", img:3, lines:["把闺蜜骗来给黑爹","看她也被黑阳具贯","两人并排挨操时","友情变成共同的浪"] }
    ],
    上签: [
      { key:"释放", img:4, lines:["黑爹准你高潮一次","潮吹喷得床单湿","射完仍要跪着谢","下次还想请开口"] },
      { key:"崇根", img:5, lines:["日日想着黑阴茎","尺寸颜色都入迷","自慰必须喊黑爹","不然不准自己去"] },
      { key:"遇贵", img:6, lines:["街头遇着真黑爹","粗壮黑阳具轮廓显","敢跟他走就有澡","一夜被操到走不回"] }
    ],
    中签: [
      { key:"游移", img:7, lines:["心已向黑嘴还硬","黑阳具贴着阴唇","今日只吃进一个头","明日就要整根吞"] },
      { key:"暗喜", img:8, lines:["表面害羞下面湿","黑皮肤一靠就软","没人逼你自己浪","腿开全因想被插"] },
      { key:"入梦", img:9, lines:["梦里全是黑阴茎","醒来小穴还在缩","梦做多了成预兆","现实很快就会应"] }
    ],
    下签: [
      { key:"受虐", img:10, lines:["黑爹扇奶又扇逼","打一下你叫一声","求饶反被干更狠","痛和爽搅成一团"] },
      { key:"开宫", img:11, lines:["黑阳具顶开子宫口","精液直接灌进宫","肚子微鼓腿还抖","受孕的感觉太清楚"] },
      { key:"曝光", img:12, lines:["被操的视频传开","熟人全看见你浪","遮脸无用名字在","夜夜有人点你名"] }
    ],
    下下签: [
      { key:"毁坏", img:13, lines:["逼被操松宫也垂","黑爹用完就丢掉","合不拢的肉洞口","只配继续给黑插"] },
      { key:"堕落", img:14, lines:["从抗拒到主动摇","黑阳具一挺就浪叫","廉耻撕光之后","只剩发情的母猪样"] },
      { key:"失神", img:15, lines:["被黑爹干到翻白眼","口水流下无知觉","身体还在一阵阵抖","脑子里只剩黑阴茎"] }
    ]
  }
};

const RANKS = ["上上签","上签","中签","下签","下下签"];
const RANK_WEIGHT = { "上上签":18, "上签":24, "中签":8, "下签":25, "下下签":25 };

let gender = "male";
let state = loadState();

function todayKey(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function storageKey(){ return "anti_bbc_daily_lot_v1"; }

function defaultState(){
  return {
    date: todayKey(),
    drawsToday: 0,
    bonusReady: false,
    collected: { male:{}, female:{} }
  };
}
function loadState(){
  try{
    const raw = localStorage.getItem(storageKey());
    if(!raw) return defaultState();
    const s = JSON.parse(raw);
    if(s.date !== todayKey()){
      s.date = todayKey();
      s.drawsToday = 0;
      s.bonusReady = false;
    }
    if(!s.collected) s.collected = {male:{},female:{}};
    if(!s.collected.male) s.collected.male = {};
    if(!s.collected.female) s.collected.female = {};
    return s;
  }catch(e){ return defaultState(); }
}
function saveState(){
  localStorage.setItem(storageKey(), JSON.stringify(state));
}

function setGender(g){
  gender = g;
  document.getElementById("btnMale").classList.toggle("on", g==="male");
  document.getElementById("btnFemale").classList.toggle("on", g==="female");
  document.getElementById("card").classList.remove("flipped");
  updateUI();
}

function pickRank(){
  let total = 0;
  RANKS.forEach(r=> total += RANK_WEIGHT[r]);
  let n = Math.random() * total;
  for(const r of RANKS){
    n -= RANK_WEIGHT[r];
    if(n <= 0) return r;
  }
  return "上签";
}
function pickLot(){
  const rank = pickRank();
  const pool = LOTS[gender][rank];
  const item = pool[Math.floor(Math.random()*pool.length)];
  return { rank, key:item.key, lines:item.lines, img:item.img };
}

function setLotImage(imgIndex){
  const img = document.getElementById("lotImg");
  const fallback = document.getElementById("imgFallback");
  const prefix = gender === "male" ? "m" : "w";
  const base = IMG_BASE + prefix + imgIndex;
  fallback.style.display = "none";
  img.style.display = "block";
  img.onerror = function(){
    if(img.dataset.triedJpg){
      img.style.display = "none";
      fallback.style.display = "block";
      fallback.textContent = prefix + imgIndex + " 未上传";
      return;
    }
    img.dataset.triedJpg = "1";
    img.src = base + ".jpg";
  };
  img.onload = function(){
    fallback.style.display = "none";
    img.style.display = "block";
    delete img.dataset.triedJpg;
  };
  delete img.dataset.triedJpg;
  img.src = base + ".png";
}

function canDraw(){
  if(state.drawsToday < 1) return true;
  if(state.bonusReady) return true;
  return false;
}

function drawLot(){
  if(!canDraw()){
    showExtra();
    updateUI();
    return;
  }
  const lot = pickLot();
  if(state.drawsToday < 1){
    state.drawsToday = 1;
  } else if(state.bonusReady){
    state.bonusReady = false;
    state.drawsToday += 1;
  }
  const id = lot.rank + "·" + lot.key;
  state.collected[gender][id] = true;
  saveState();

  const badge = document.getElementById("rankBadge");
  badge.textContent = lot.rank;
  badge.className = "rank-badge rank-" + lot.rank;
  document.getElementById("lotTitle").textContent = lot.key;
  document.getElementById("lotVerse").innerHTML = lot.lines.map(l=>"<div>"+l+"</div>").join("");
  setLotImage(lot.img);

  const card = document.getElementById("card");
  card.classList.remove("flipped");
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=> card.classList.add("flipped"));
  });
  updateUI();
}

function showExtra(){
  document.getElementById("extraPanel").classList.add("show");
}
function hideExtra(){
  document.getElementById("extraPanel").classList.remove("show");
}

function answerClimax(yes){
  if(yes){
    document.getElementById("statusLine").textContent = "高潮过了就守规矩 · 明日再来";
    hideExtra();
    updateUI();
    return;
  }
  state.bonusReady = true;
  saveState();
  hideExtra();
  document.getElementById("statusLine").textContent = "未高潮 · 已获一次加抽，请点「抽签」";
  updateUI();
}

function sponsorSchool(){
  state.bonusReady = true;
  saveState();
  hideExtra();
  document.getElementById("statusLine").textContent = "感谢赞助学校 · 已获一次加抽";
  updateUI();
}

function allLotIds(g){
  const ids = [];
  RANKS.forEach(r=>{
    LOTS[g][r].forEach(item=> ids.push(r+"·"+item.key));
  });
  return ids;
}

function updateUI(){
  const btn = document.getElementById("btnDraw");
  const status = document.getElementById("statusLine");
  if(canDraw()){
    btn.disabled = false;
    if(state.drawsToday===0) status.textContent = "今日尚未抽签";
    else if(state.bonusReady) status.textContent = "加抽机会已就绪 · 可再抽一次";
    else status.textContent = "可以抽签";
  } else {
    btn.disabled = true;
    status.textContent = "今日次数已用尽";
    document.getElementById("extraPanel").classList.add("show");
  }

  const ids = allLotIds(gender);
  const got = state.collected[gender] || {};
  let count = 0;
  ids.forEach(id=>{ if(got[id]) count++; });
  const full = count >= ids.length;
  document.getElementById("statsMeta").innerHTML =
    `本卷已收集 <strong>${count}</strong> / <strong>${ids.length}</strong> · ${full?"已集齐本卷":"未集齐"}`;

  const grid = document.getElementById("chipGrid");
  grid.innerHTML = "";
  ids.forEach(id=>{
    const [rank,key] = id.split("·");
    const el = document.createElement("span");
    el.className = "chip" + (got[id]?" got":"");
    el.innerHTML = (got[id]?key:"？？") + `<span class="r">${rank.replace("签","")}</span>`;
    grid.appendChild(el);
  });
}

updateUI();
</script>
</body>
</html>
